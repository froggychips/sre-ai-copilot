apiVersion: batch/v1
kind: Job
metadata:
  name: sre-ai-migrate
  labels:
    app: sre-ai-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        # Лейбл на POD-е (не только на Job) — иначе NetworkPolicy
        # (k8s/networkpolicy.yaml) не выпустит миграции к Postgres.
        app: sre-ai-migrate
    spec:
      serviceAccountName: sre-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
      - name: migrate
        # IMAGE_PLACEHOLDER подставляет deploy.sh целиком (registry+repo+tag).
        # Registry задаётся через IMAGE_REPO — он разный по кластерам:
        # CI публикует в ghcr по git-sha, а WO-кластер тянет из Nexus
        # по тегу 1.0.0-rc.N. Хардкод ghcr здесь означал, что deploy.sh
        # в WO-кластере молча упирался в ImagePullBackOff.
        # CI публикует ТОЛЬКО :<git-sha> — тега :latest не существует.
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command:
        - alembic
        - upgrade
        - head
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        # lock_timeout ОБЯЗАТЕЛЕН. ALTER TABLE требует ACCESS EXCLUSIVE, и если
        # лок занят долгой транзакцией, DDL встаёт в очередь — а очередь на
        # лок в PostgreSQL блокирует ВСЕХ, кто пришёл после неё. Замер
        # 08.08.2026: миграция kg_services так подвесила семь читателей и
        # положила приложение на 6 минут, а осиротевшее соединение пришлось
        # снимать через pg_terminate_backend. С таймаутом Job просто падает,
        # ничего за собой не утащив, — и его можно повторить, заглушив
        # писателей (см. deploy.sh).
        - name: PGOPTIONS
          value: "-c lock_timeout=15s"
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
