apiVersion: batch/v1
kind: Job
metadata:
  name: sre-ai-migrate
  labels:
    app: sre-ai-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        # Лейбл на POD-е (не только на Job) — иначе NetworkPolicy
        # (k8s/networkpolicy.yaml) не выпустит миграции к Postgres.
        app: sre-ai-migrate
    spec:
      serviceAccountName: sre-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
      - name: migrate
        # IMAGE_TAG_PLACEHOLDER подставляет deploy.sh (IMAGE_TAG=<git-sha>).
        # CI публикует ТОЛЬКО :<git-sha> — тега :latest не существует.
        image: ghcr.io/froggychips/sre-ai-copilot:IMAGE_TAG_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command:
        - alembic
        - upgrade
        - head
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
