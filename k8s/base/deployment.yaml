apiVersion: v1
kind: Service
metadata:
  name: sre-ai-api
spec:
  selector:
    app: sre-ai-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-api
spec:
  replicas: 2
  # Явные числа вместо дефолтных 25%. При двух репликах 25% даёт maxSurge=1
  # (округление вверх) и maxUnavailable=0 (округление вниз), то есть k8s
  # обязан поднять новый под и дождаться его готовности, прежде чем гасить
  # старый. Обновление выходит строго последовательным: до 60s startupProbe
  # на пода плюс 30s терминации — три выката подряд 21.08.2026 не укладывались
  # в 300s таймаута deploy.sh и отчитывались ложным «Deploy FAILED».
  #
  # maxUnavailable=1 допустим: PodDisruptionBudget ниже требует minAvailable=1,
  # и при двух репликах одна остаётся обслуживать запросы.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sre-ai-api
  template:
    metadata:
      labels:
        app: sre-ai-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      serviceAccountName: sre-ai
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        # IMAGE_PLACEHOLDER подставляет deploy.sh целиком (registry+repo+tag).
        # Registry задаётся через IMAGE_REPO — он разный по кластерам:
        # CI публикует в ghcr по git-sha, а WO-кластер тянет из Nexus
        # по тегу 1.0.0-rc.N. Хардкод ghcr здесь означал, что deploy.sh
        # в WO-кластере молча упирался в ImagePullBackOff.
        # CI публикует ТОЛЬКО :<git-sha> (см. .github/workflows/ci.yml) —
        # тега :latest не существует, apply без подстановки = ImagePullBackOff.
        # Pin по digest в CI: image: ghcr.io/froggychips/sre-ai-copilot@sha256:<digest>
        image: IMAGE_PLACEHOLDER
        # Теги immutable (git-sha) → IfNotPresent корректен и не дёргает registry.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        # Порт метрик объявлен, хотя приложение слушает его и без этого:
        # без имени порта VMPodScrape приходится целить числом, а число в
        # scrape-объекте расходится с кодом молча. NetworkPolicy пускает
        # сюда только ns monitoring.
        - containerPort: 8001
          name: metrics
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        env:
        # ENV=production включает fail-closed-валидаторы в app/config.py
        # (обязательные секреты + запрет SAFE_MODE=false). Заполни secrets.yaml.
        - name: ENV
          value: "production"
        - name: SAFE_MODE
          value: "true"
        # ── дальше: то, что жило ТОЛЬКО в кластере ────────────────────────
        #
        # 21.08.2026 выяснилось, что этот манифест и работающий Deployment
        # разошлись полностью: в git было две переменные и ни одного тома, в
        # кластере — три других переменные, ConfigMap с ownership и emptyDir
        # под /tmp. Ни одна не совпадала. Применение манифеста роняло поды на
        # старте и попутно снесло бы рабочую конфигурацию, которой нет больше
        # нигде. Прод жил на ревизии, воспроизвести которую из репозитория
        # было нельзя.
        #
        # Подписывать вебхук AlertManager нечем: стоковый
        # AlertManager/VMAlertmanager не умеет считать HMAC от body (подробно
        # в k8s/vmalertmanagerconfig.yaml). Выбран второй вариант из двух
        # описанных там — изоляция трафика NetworkPolicy без секрета, — и
        # опт-аут обязан быть явным, иначе config.py откажется стартовать.
        - name: ALERTMANAGER_ALLOW_UNAUTHENTICATED
          value: "true"
        # Пустой список, а не ["*"]: браузерных клиентов у этого API нет
        # (Ingress выставлен на плейсхолдер, обращений к защищённым
        # эндпоинтам ноль), а wildcard в проде запрещён гвардом в
        # app/main.py. Пустой список — самое строгое из возможного: ни один
        # cross-origin запрос не проходит.
        - name: ALLOWED_ORIGINS
          value: "[]"
        # Ручной override владельцев сервисов. Файл приезжает из ConfigMap
        # sre-ai-copilot-ownership (том ниже); без переменной и тома
        # ownership_suggester теряет manual-источник и откатывается на
        # inference.
        - name: OWNERSHIP_MANIFEST_PATH
          value: /config/ownership.yaml
        # Тег РЕАЛЬНО задеплоенного образа — попадает в Discord-сообщения.
        # Подставляется deploy.sh из IMAGE_TAG: в кластере значение застыло
        # на 1.0.0-rc.29, потому что ставилось руками и при выкатах не
        # обновлялось.
        - name: BUILD_VERSION
          value: "BUILD_VERSION_PLACEHOLDER"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          # /readyz уже делает SELECT 1 к Postgres (см. app/main.py:readyz).
          # pg_isready через exec.command не раскрывает $(DATABASE_URL) без
          # shell — отсюда и шёл silent-fail. HTTP-проба надёжнее.
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          # До 60 секунд на старт — достаточно для миграции БД и init-overhead.
          periodSeconds: 5
          failureThreshold: 12
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        # subPath: монтируется ОДИН файл, а не каталог — иначе /config
        # затенил бы всё остальное содержимое каталога в образе.
        - name: ownership
          mountPath: /config/ownership.yaml
          subPath: ownership.yaml
          readOnly: true
        # readOnlyRootFilesystem: true выше означает, что писать некуда
        # вообще. Без этого тома любая запись в /tmp — а её делают tempfile,
        # matplotlib-кэш и сам Python при сборке .pyc — падает с EROFS.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: ownership
        configMap:
          name: sre-ai-copilot-ownership
      - name: tmp
        emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-ai-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sre-ai-api
