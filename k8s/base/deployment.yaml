apiVersion: v1
kind: Service
metadata:
  name: sre-ai-api
spec:
  selector:
    app: sre-ai-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-ai-api
  template:
    metadata:
      labels:
        app: sre-ai-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      serviceAccountName: sre-ai
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        # Pin по digest в CI: image: ghcr.io/froggychips/sre-ai-copilot@sha256:<digest>
        image: ghcr.io/froggychips/sre-ai-copilot:latest
        ports:
        - containerPort: 8000
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          # /readyz уже делает SELECT 1 к Postgres (см. app/main.py:readyz).
          # pg_isready через exec.command не раскрывает $(DATABASE_URL) без
          # shell — отсюда и шёл silent-fail. HTTP-проба надёжнее.
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          # До 60 секунд на старт — достаточно для миграции БД и init-overhead.
          periodSeconds: 5
          failureThreshold: 12
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-ai-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sre-ai-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sre-ai-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
spec:
  tls:
  - hosts:
    - sre-ai.example.com
    secretName: sre-ai-tls
  rules:
  - host: sre-ai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sre-ai-api
            port:
              number: 8000
