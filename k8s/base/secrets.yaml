# ⚠️ Этот файл — ТОЛЬКО шаблон для local kind/minikube.
#
# В prod НИКОГДА не коммитить Secret с stringData. Использовать один из:
#
#   1. SealedSecrets — см. secrets.sealed.yaml.example (рекомендуется
#      для GitOps-репозитория без отдельного secret store).
#   2. ExternalSecrets (ESO) — см. secrets.external.yaml.example
#      (если уже есть Vault/AWS SM/GCP SM).
#
# Для local-dev seed-а:
#   cp secrets.yaml secrets.local.yaml
#   # заполнить ANTHROPIC_API_KEY/DISCORD_WEBHOOK_URL руками
#   kubectl apply -f secrets.local.yaml
#   # secrets.local.yaml — в .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: sre-ai-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "redis://redis:6379/0"
  DISCORD_WEBHOOK_URL: "REPLACE_ME"
  ALERTMANAGER_WEBHOOK_SECRET: "REPLACE_ME"
