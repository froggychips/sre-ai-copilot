# RBAC для sre-ai (api + worker).
#
# Принципы:
#   * ОТКАЗ default-SA: pod-ы используют sre-ai SA с явным наборов прав.
#   * Чтение — широкое (pod/pod log/event/deployment в большинстве ns).
#   * Запись — только то, что реально дёргает agent fix/synthesis:
#       - deployments rollout (patch/scale) — в whitelisted namespace-ах.
#       - pod eviction (delete) — там же.
#   * forbidden ns (kube-system, kube-public, kube-node-lease, chaos-mesh, mcp)
#     не покрываются НИЧЕМ — guard в коде дополнительно блокирует, но и API
#     уровень тоже отрезан.
#
# Применять отдельно для каждого target-namespace (squad-*):
#   kubectl -n squad-foo apply -f rbac.yaml
# либо через kustomize patch — добавлять RoleBinding для нужных namespace-ов.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-ai
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
automountServiceAccountToken: true

---
# Read-only Role на текущий namespace — применяется в любом ns, куда
# деплоится sre-ai либо где он должен расследовать инциденты.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-ai-read
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-ai-read
subjects:
- kind: ServiceAccount
  name: sre-ai
  namespace: default  # перенесать в свой namespace при kustomize-overlay
roleRef:
  kind: Role
  name: sre-ai-read
  apiGroup: rbac.authorization.k8s.io

---
# Write-Role применяется ТОЛЬКО в squad-* (через отдельный RoleBinding).
# Не делать ClusterRoleBinding — иначе обходим principle of least privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-ai-remediate
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]  # для restart/eviction
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]  # под жёстким allowlist в k8s_guard

---
# Пример write-binding в squad-* namespace. Размножать через kustomize.
# Не применять автоматически — каждый bind должен быть осознанным merge'ем.
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: sre-ai-remediate
#   namespace: squad-foo
# subjects:
# - kind: ServiceAccount
#   name: sre-ai
#   namespace: default
# roleRef:
#   kind: Role
#   name: sre-ai-remediate
#   apiGroup: rbac.authorization.k8s.io

---
# ClusterRole: read-only на deployments / services / ingresses cluster-wide.
# Нужен kg_sync (hourly Celery beat) для построения ServiceEdge-графа +
# Wave 7 / G1.3 declarative parser kg_topology_resources_sync (каждые 15 мин),
# который читает Service.spec.selector и Ingress.spec.rules cluster-wide
# и строит edges `serves_traffic` / `routes_to`.
# Только get/list/watch — write не затронут (write-Role остаётся namespace-scoped).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-ai-deployments-reader
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
# Wave 7 / G1.3: declarative Service + Ingress parser.
# Services: spec.selector → match на Deployment pod-template labels.
# Ingresses: spec.rules[].http.paths[].backend.service.name → backend match.
# Без cluster-wide прав парсер пришлось бы скакать per-namespace, что
# создаёт N kubectl-вызовов и не покрывает ns без RoleBinding.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
# KG Coverage #1: k8s Job + CronJob → kg_k8s_jobs. Cluster-wide read
# нужен для backup-CronJob'ов в `*-shared` ns + alembic-Job'ов в ns
# деплоя. pods (cluster-wide) — для resolve last_pod_exit_code у Failed
# Job'ов (label-selector job-name=<name>).
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
# KG Coverage #2 (storage signals): k8s_storage_sync читает PVC + PV
# cluster-wide + scan pods для uses_volume edges. ReplicaSets нужны для
# resolution Pod → Deployment owner-chain. Только get/list/watch.
# pods объединены с #1 ниже одним правилом.
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-ai-deployments-reader
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
subjects:
- kind: ServiceAccount
  name: sre-ai
  namespace: sre-ai   # namespace куда деплоится app; поменять через kustomize-overlay
roleRef:
  kind: ClusterRole
  name: sre-ai-deployments-reader
  apiGroup: rbac.authorization.k8s.io
