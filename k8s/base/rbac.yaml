# RBAC для sre-ai-copilot.
#
# Два ServiceAccount-а, и разница между ними — вся суть файла:
#   * sre-ai          — api, worker, beat, migrate-Job. ТОЛЬКО чтение.
#   * sre-ai-executor — deployment copilot-executor (k8s/executor.yaml), и
#                       больше никто. Единственный, к кому привязывается
#                       write-роль sre-ai-remediate.
#
# До 24.09.2026 SA был один: write-роль, привязанная к sre-ai, доставалась
# и api-поду, который принимает вебхуки из интернета, и worker-у, который
# гоняет LLM по логам и тексту алертов. Теперь api и worker только кладут
# задачу в очередь executor (EXECUTOR_DISPATCH=queue, см. app/config.py), а
# kubectl-запись делает отдельный процесс под своим SA.
#
# Принципы:
#   * ОТКАЗ default-SA: pod-ы используют явный SA с явным набором прав.
#   * Чтение — широкое (pod/pod log/event/deployment в большинстве ns).
#   * Запись — только то, что реально исполняет executor
#     (app/core/execution_dsl.py): rollout restart и scale deployment-а.
#     `--dry-run=server` для RBAC — тот же patch, поэтому и dry-run живёт в
#     executor-е, а не в worker-е.
#   * forbidden ns (kube-system, kube-public, kube-node-lease, chaos-mesh, mcp)
#     не покрываются НИЧЕМ — guard в коде дополнительно блокирует, но и API
#     уровень тоже отрезан.
#
# Write-роль применяется отдельно для каждого target-namespace (squad-*):
#   kubectl -n squad-foo apply -f rbac.yaml
# и RoleBinding на sre-ai-executor — осознанно, по одному (пример ниже).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-ai
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
automountServiceAccountToken: true

---
# SA исполнителя. Только его токен может менять кластер (через RoleBinding
# на sre-ai-remediate в конкретных squad-* ns). Токен монтируется только в
# под copilot-executor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-ai-executor
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
automountServiceAccountToken: true

---
# Read-only Role на текущий namespace — применяется в любом ns, куда
# деплоится sre-ai либо где он должен расследовать инциденты.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-ai-read
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-ai-read
subjects:
- kind: ServiceAccount
  name: sre-ai
  namespace: default  # перенесать в свой namespace при kustomize-overlay
roleRef:
  kind: Role
  name: sre-ai-read
  apiGroup: rbac.authorization.k8s.io

---
# Write-Role применяется ТОЛЬКО в squad-* (через отдельный RoleBinding) и
# ТОЛЬКО на SA sre-ai-executor. Не делать ClusterRoleBinding — иначе обходим
# principle of least privilege.
#
# Состав — ровно то, что умеет execution_dsl: `rollout restart` (patch
# deployment) и `scale` (patch/update deployments/scale); get/list — для
# `--current-replicas` и снимков verification. Прежние `delete pods` и
# `create pods/exec` сняты 24.09.2026: ни один путь кода их не вызывал, а
# exec под write-SA — это произвольная команда в любом контейнере ns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-ai-remediate
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]

---
# Пример write-binding в squad-* namespace. Размножать через kustomize.
# Не применять автоматически — каждый bind должен быть осознанным merge'ем.
# Subject — ТОЛЬКО sre-ai-executor: bind на sre-ai вернул бы write-права
# api-поду.
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: sre-ai-remediate
#   namespace: squad-foo
# subjects:
# - kind: ServiceAccount
#   name: sre-ai-executor
#   namespace: sre-ai
# roleRef:
#   kind: Role
#   name: sre-ai-remediate
#   apiGroup: rbac.authorization.k8s.io

---
# ClusterRole: read-only на deployments / services / ingresses cluster-wide.
# Нужен kg_sync (hourly Celery beat) для построения ServiceEdge-графа +
# Wave 7 / G1.3 declarative parser kg_topology_resources_sync (каждые 15 мин),
# который читает Service.spec.selector и Ingress.spec.rules cluster-wide
# и строит edges `serves_traffic` / `routes_to`.
# Только get/list/watch — write не затронут (write-Role остаётся namespace-scoped).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-ai-deployments-reader
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
rules:
- apiGroups: ["apps"]
  # statefulsets/daemonsets ОБЯЗАТЕЛЬНЫ для ребра serves_traffic: без них
  # Service, за которым стоит БД, не матчится ни на один workload — замер
  # 08.08.2026 дал 2231 промах за тик синка, и это ровно все *-db /
  # *-postgresql / clickhouse. Права добавлены в кластер патчем в тот же день;
  # здесь фиксируем, чтобы манифест не разъезжался с реальностью.
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
# CNPG: поды кластера создаёт оператор из Cluster CR, и без чтения этого
# ресурса Service `*-cnpg-rw` не матчится ни на один workload. Замер
# 17.09.2026: живой primary config-worker-db-cnpg не был представлен в графе
# вообще, а оставленный для отката StatefulSet — был.
#
# Права здесь ОБЯЗАТЕЛЬНЫ именно потому, что их отсутствие не видно:
# `_kubectl_get_all` превращает Forbidden в пустой список, то есть синк не
# упадёт и не залогирует ошибку — он просто никогда не найдёт ни одного
# кластера, и фикс топологии молча не заработает.
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch"]
# `namespaces` cluster-wide list — auto-discovery non-system ns в
# kg_sync.discover_namespaces() и drift_cleanup.fetch_live_namespaces().
# Regression от 2026-05-24: при apply нового ClusterRole было утрачено это
# правило (старая версия имела `["deployments","namespaces"]`).
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Wave 7 / G1.3: declarative Service + Ingress parser.
# Services: spec.selector → match на Deployment pod-template labels.
# Ingresses: spec.rules[].http.paths[].backend.service.name → backend match.
# Без cluster-wide прав парсер пришлось бы скакать per-namespace, что
# создаёт N kubectl-вызовов и не покрывает ns без RoleBinding.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
# KG Coverage #1: k8s Job + CronJob → kg_k8s_jobs. Cluster-wide read
# нужен для backup-CronJob'ов в `*-shared` ns + alembic-Job'ов в ns
# деплоя. pods (cluster-wide) — для resolve last_pod_exit_code у Failed
# Job'ов (label-selector job-name=<name>).
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
# KG Coverage #2 (storage signals): k8s_storage_sync читает PVC + PV
# cluster-wide + scan pods для uses_volume edges. ReplicaSets нужны для
# resolution Pod → Deployment owner-chain. Только get/list/watch.
# pods объединены с #1 ниже одним правилом.
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
# Endpoints (15.08.2026) — точный ответ на «какие поды реально стоят за этим
# Service». Без них `serves_traffic` достраивается по совпадению имён, а
# «Service объявлен, за ним пусто» не видно вовсе: замер дал 83 таких Service,
# и ни один не был headless или ExternalName — то есть все 83 аномальны.
#
# NB: namespace-scoped Role `sre-ai-read` выше тоже перечисляет endpoints, но
# действует ТОЛЬКО в namespace копилота. До этого правила `can-i get endpoints`
# отвечал `yes` в `sre-ai` и `no` во всех остальных — легко принять за
# «доступ есть».
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
# NetworkPolicies (15.08.2026) — объявленные связи «кто с кем говорит».
# Масштаб честный: из 775 политик кластера только 55 несут peer-селекторы и
# дают ~638 рёбер (3% графа). Ценность не в объёме, а в классе: это
# declared_k8s, которых в графе всего 44.6%.
#
# Осторожно с обратным выводом: 1441 правило — «разрешить всем», а под, не
# покрытый ни одной политикой, в k8s разрешён везде. Поэтому «путь запрещён»
# из отсутствия правила НЕ следует.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-ai-deployments-reader
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
subjects:
- kind: ServiceAccount
  name: sre-ai
  namespace: sre-ai   # namespace куда деплоится app; поменять через kustomize-overlay
# Executor-у чтение нужно для своей же работы: `--current-replicas` у scale,
# снимок цели до/после записи (app/remediation/verification.py), резолв
# target-а. Чтение без записи — то же, что у sre-ai.
- kind: ServiceAccount
  name: sre-ai-executor
  namespace: sre-ai
roleRef:
  kind: ClusterRole
  name: sre-ai-deployments-reader
  apiGroup: rbac.authorization.k8s.io
