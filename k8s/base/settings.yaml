# Несекретные настройки поведения sre-ai-copilot — общие для всех пяти
# Deployment-ов (api, worker, worker-sync, beat, executor) и Job-а миграций.
#
# ЗАЧЕМ. До 18.11.2026 эти флаги жили ключами Secret `sre-ai-secrets` вперемешку
# с токенами: «мост включён», «executor включён», «какой LLM-бэкенд» нельзя было
# ни прочитать из git, ни воспроизвести в другом кластере, а часть флагов
# (дайджесты, Seq стендов) стояла литералами только у воркеров. Теперь правило
# одно: поведение — здесь, секреты — в Secret-ах по ролям
# (k8s/base/secrets.*.yaml.example), в Deployment-ах — только то, что
# действительно различается по ролям.
#
# ПРИОРИТЕТ ИСТОЧНИКОВ (от слабого к сильному):
#   1. этот ConfigMap     — первым в `envFrom`;
#   2. Secret роли        — последним в `envFrom`: при совпадении ключей в
#                           envFrom побеждает ПОСЛЕДНИЙ источник;
#   3. литеральный `env`  — побеждает любой envFrom. Там остаются инварианты
#                           (ENV, SAFE_MODE), то, что разное по ролям
#                           (EXECUTOR_DISPATCH), и BUILD_VERSION; туда же
#                           попадает аварийное `kubectl set env`.
#
# Порядок выбран ради безопасного перехода: пока ключ ещё лежит в Secret,
# действует значение из Secret — применение этого файла поведение не меняет.
# Источником правды ConfigMap становится в момент удаления ключа из Secret
# (docs/RUNBOOK.ru.md, «Настройки: ConfigMap и секреты по ролям»). Чтобы
# дубль не жил молча, deploy.sh сверяет пересечение: ключ есть и здесь, и в
# Secret с ДРУГИМ значением — отказ до любых изменений в кластере.
#
# ENV и SAFE_MODE сюда НЕ переносятся намеренно. Это предохранители
# (fail-closed-валидаторы app/config.py), и литерал в pod-спеке — единственное
# место, которое не перекрыть забытым ключом Secret. Не теория: в
# `sre-ai-secrets` лежит свой ENV, и Job миграций (у него литерала нет)
# проходит валидаторы только потому, что значение там не production.
#
# ПОД НЕ ПЕРЕЧИТЫВАЕТ envFrom на лету. deploy.sh подставляет в шаблоны подов
# аннотацию `checksum/settings` — изменение файла даёт rollout. При правке
# ConfigMap руками нужен `kubectl rollout restart`.
#
# Значения, помеченные «СВЕРИТЬ», не были известны на момент написания (Secret
# не читался): выставлен дефолт кода или наблюдаемое поведение. Расхождение
# поймает deploy.sh; после сверки пометку снять.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-ai-copilot-settings
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
data:
  # ── LLM ────────────────────────────────────────────────────────────────
  # claude_cli: ANTHROPIC_API_KEY не обязателен. Дефолт кода — anthropic, и с
  # ним Settings отказывается стартовать без ключа, то есть этот флаг нужен
  # КАЖДОМУ процессу, включая beat и executor, которые LLM не зовут.
  LLM_BACKEND: "claude_cli"

  # ── Вебхук AlertManager ────────────────────────────────────────────────
  # Стоковый AlertManager не умеет HMAC; граница доверия — NetworkPolicy
  # (k8s/networkpolicy.yaml, k8s/vmalertmanagerconfig.yaml). Без явного
  # опт-аута процесс с ENV=production не поднимется.
  ALERTMANAGER_ALLOW_UNAUTHENTICATED: "true"

  # ── Discord ────────────────────────────────────────────────────────────
  # «Боту можно писать в Discord». Совпадает с дефолтом, фиксируется явно.
  # СВЕРИТЬ с живым значением перед применением: ключ есть в sre-ai-secrets,
  # а у api и beat литерала не было — они жили на значении из Secret.
  DISCORD_DRY_RUN: "false"
  # Обогащённая карточка на /webhooks/alertmanager/enrich-and-forward.
  # СВЕРИТЬ с живым значением перед применением: значение из Secret не
  # читалось; true выставлено по поведению (api пишет enrich_forward.* в лог).
  DISCORD_ENRICH_ENABLED: "true"

  # ── Remediation: мост, executor, кнопки ────────────────────────────────
  # Как выключить и в каком порядке включать — docs/RUNBOOK.ru.md, «Мост
  # remediation и кнопки». Флаги включены, но запись в кластер работает
  # только там, где есть RoleBinding на sre-ai-remediate (k8s/base/rbac.yaml).
  REMEDIATION_BRIDGE_ENABLED: "true"
  EXECUTOR_ENABLED: "true"
  EXECUTOR_APPROVAL_ENABLED: "true"

  # ── Дайджесты и фоновые задачи (читает воркер, дефолт кода — false) ────
  STATS_DIGEST_ENABLED: "true"
  CHRONIC_DIGEST_ENABLED: "true"
  OWNERSHIP_BACKFILL_ENABLED: "true"
  # Error/Fatal из Seq стендов → kg_log_observations. Требует egress
  # copilot → seq:80 (k8s/networkpolicy.yaml).
  SEQ_SQUAD_DISCOVERY_ENABLED: "true"

  # ── Синки графа ────────────────────────────────────────────────────────
  # СВЕРИТЬ с живым значением перед применением: стоит дефолт кода (20).
  KG_METRICS_SYNC_CONCURRENCY: "20"

  # ── Рантайм ────────────────────────────────────────────────────────────
  # Не настройка Settings: путь импорта пакета `app` (WORKDIR образа — /app).
  # СВЕРИТЬ с живым значением перед применением.
  PYTHONPATH: "/app"

  # ── Новые настройки — добавлять НИЖЕ ───────────────────────────────────
  # Правила:
  #   * только несекретное и одинаковое для всех ролей; токены, пароли, URL
  #     с учётными данными и адреса внутренних систем — в Secret роли;
  #   * ключ = имя поля Settings (app/config.py), значение — строка в
  #     кавычках; tests/test_settings_configmap.py отклонит опечатку в имени
  #     и значение, с которым процесс не стартует;
  #   * новый путь кода включать сначала на одном namespace под нагрузкой
  #     (RUNBOOK, «Включение новых флагов») — через `kubectl set env`, а сюда
  #     переносить, когда устоялось.
