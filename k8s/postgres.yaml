# ⚠️ ЭТО DEV-ONLY single-replica Postgres.
#
# Для prod-grade HA использовать ОДИН из вариантов:
#   * CloudNativePG (рекомендуется) — см. postgres.cnpg.yaml.example.
#   * Managed (RDS / Cloud SQL / Aiven) — secrets.external.yaml забирает URL.
#   * Bitnami `postgresql-ha` Helm chart — если HA на самом кластере.
#
# Single-replica устраивает только local kind/minikube и preview-env-ы,
# где допустимо терять данные при рестарте ноды.

apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      # Не переезжает (local-path на dev-4) — выселять последним, см. k8s/priorityclass.yaml.
      priorityClassName: sre-ai-copilot-stateful
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          # 31.10.2026: образ стартовал на дефолтах — shared_buffers 128 МБ при
          # БД 5,3 ГБ и лимите 2Gi, work_mem 4 МБ, без pg_stat_statements
          # (медленный синк диагностировали вслепую, см. 16.10 ниже).
          # Значения под limits.memory 2Gi: буферы четверть, остальное —
          # page cache. Расширение после рестарта создаётся один раз:
          #   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          args:
            - -c
            - shared_buffers=512MB
            - -c
            - work_mem=16MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - shared_preload_libraries=pg_stat_statements
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            # PGDATA должна быть подпапкой, иначе init падает на lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # 16.10.2026: при limit 1 CPU postgres троттлился 78–93% периодов всю
          # неделю — ~25 мс на простой запрос, kg_topology_sync 611–756 с (93%
          # времени внутри SQL по замеру #503). Нода dev-4: 48 ядер, занято ~72%.
          resources:
            limits:
              cpu: "4"
              memory: 2Gi
            # 01.11.2026: requests.memory 1Gi → 2Gi (= limit). Рабочий набор
            # 1,28 ГиБ сейчас, пик 1,79 ГиБ за неделю — при 1Gi postgres всё время
            # «над requests» и при нехватке ресурсов ноды выселялся бы первым.
            requests:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: gp3   # на AWS EBS gp3; в kind/minikube — оставить пустым (default)
        resources:
          requests:
            storage: 50Gi
