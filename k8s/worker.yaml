apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-worker
  labels:
    app: copilot-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: copilot-worker
  template:
    metadata:
      labels:
        app: copilot-worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      serviceAccountName: sre-ai
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        # IMAGE_PLACEHOLDER подставляет deploy.sh целиком (registry+repo+tag).
        # Registry задаётся через IMAGE_REPO — он разный по кластерам:
        # CI публикует в ghcr по git-sha, а WO-кластер тянет из Nexus
        # по тегу 1.0.0-rc.N. Хардкод ghcr здесь означал, что deploy.sh
        # в WO-кластере молча упирался в ImagePullBackOff.
        # CI публикует ТОЛЬКО :<git-sha> — тега :latest не существует.
        # Pin по digest в CI: image: ghcr.io/froggychips/sre-ai-copilot@sha256:<digest>
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - app.workers.tasks.celery_app
        - worker
        - --loglevel=info
        # concurrency=2, НЕ 4 — см. арифметику в resources ниже.
        - --concurrency=2
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        env:
        # ENV=production включает fail-closed-валидаторы в app/config.py
        # (обязательные секреты + запрет SAFE_MODE=false). Заполни secrets.yaml.
        - name: ENV
          value: "production"
        - name: SAFE_MODE
          value: "true"
        # ── дальше: то, что жило ТОЛЬКО в кластере ────────────────────────
        #
        # 21.08.2026: манифест и работающий Deployment разошлись полностью. В
        # git было две переменные и ни одного тома у воркера, в кластере —
        # пять других переменных, ConfigMap с ownership и emptyDir под /tmp.
        # Применение манифеста роняло поды на старте (config.py требовал
        # HMAC-секрет) и попутно отключило бы дайджест и ownership-backfill:
        # их дефолты в app/config.py — False.
        - name: ALERTMANAGER_ALLOW_UNAUTHENTICATED
          value: "true"
        - name: OWNERSHIP_MANIFEST_PATH
          value: /config/ownership.yaml
        # Подставляется deploy.sh из IMAGE_TAG; в кластере значение застыло
        # на 1.0.0-rc.29, потому что ставилось руками.
        - name: BUILD_VERSION
          value: "BUILD_VERSION_PLACEHOLDER"
        # Дефолт False — без явного true ежедневный дайджест выключится.
        - name: STATS_DIGEST_ENABLED
          value: "true"
        # Тоже дефолт False: periodic backfill team_owner через
        # multi-signal inference.
        - name: OWNERSHIP_BACKFILL_ENABLED
          value: "true"
        # Значение совпадает с дефолтом, но фиксируется явно: «боту можно
        # писать в Discord» — не та настройка, которую стоит оставлять на
        # усмотрение дефолта в конфиге.
        - name: DISCORD_DRY_RUN
          value: "false"
        # ── Liveness ─────────────────────────────────────────────────────────
        # До этого у воркера НЕ БЫЛО ни одной пробы (у api — все три). OOM ловит
        # kubelet сам, но всё, что НЕ OOM — CPU-троттлинг, залипший
        # kubectl-subprocess, потерянный broker-коннект после сетевого флапа —
        # оставляет процесс Running бесконечно и без единого сигнала: при
        # 2 репликах × concurrency=2 тихо выпадает половина слотов, задачи
        # копятся в redis и мрут по expires. Именно так дайджест
        # daily_stats_digest два дня молча протухал в очереди (10.08.2026).
        #
        # ПОЧЕМУ ПРОБА НЕ УБЬЁТ ЗАНЯТЫЙ ВОРКЕР. `inspect ping` обслуживает
        # control-thread ГЛАВНОГО процесса, а не prefork-дети: воркер, у которого
        # все слоты заняты 30-минутным incident-pipeline (hard limit 1800s),
        # отвечает на ping штатно — проверено локально на занятом concurrency=1
        # воркере: exit 0 за 0.19s. Провалить пробу может только вставший main
        # loop или потеря связи с брокером — ровно то, что мы и ловим.
        #
        # `-b "$REDIS_URL"` вместо `-A app.workers.tasks.celery_app` — НАМЕРЕННО.
        # С `-A` каждая проба импортировала бы весь стек приложения (~166 MiB RSS
        # и секунды CPU в лимите 600m, см. арифметику в resources ниже) — то есть
        # сама создавала бы троттлинг и таймауты, от которых должна защищать.
        # Без `-A` поднимается только celery+kombu: замер — 41 MiB peak RSS,
        # 0.19s CPU. REDIS_URL берётся из того же envFrom (sre-ai-secrets), из
        # которого его читает сам воркер, → проба смотрит ровно в тот брокер,
        # из которого воркер ест. Результат-бэкенд пробе не нужен: control-ответ
        # идёт по брокерному pidbox.
        #
        # `-d celery@<pod>` ОБЯЗАТЕЛЕН: без destination ping — это broadcast, и
        # за зависшую реплику ответит живая соседка (проба стала бы фикцией).
        # Имя нода celery — `celery@$(socket.gethostname())` = имя пода.
        # HOSTNAME проставляет runtime; `hostname` — фолбэк, если его нет.
        #
        # ПАРАМЕТРЫ:
        #   initialDelaySeconds=120 — старт воркера = импорт стека + коннект к
        #     брокеру; на 600m это десятки секунд, берём ×4 запаса.
        #   periodSeconds=60 — при 0.19s CPU на пробу это 0.3% ядра.
        #   timeoutSeconds=15 > `-t 10` — kubelet не должен срезать пробу раньше,
        #     чем celery сам вернёт non-zero (недостижимый брокер = exit 69
        #     примерно за 6s: kombu до отказа ретраит коннект).
        #   failureThreshold=5 — рестарт только после ~5 минут молчания. Liveness,
        #     висящая на внешней зависимости, легко превращает блип redis в
        #     аутедж: оба воркера уходят в рестарт-петлю одновременно. 5 минут —
        #     заведомо больше любого реконнекта celery и меньше времени, за
        #     которое очередь начинает терять задачи по expires (минимальный
        #     expires в beat_schedule — 50s у kg-external-probe, но её потеря
        #     безобидна; критичные — часы).
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            # stdout НЕ глушим: текст ошибки celery попадает в Unhealthy-event
            # (`kubectl describe pod`) — иначе диагностика сводится к «проба упала».
            - 'celery -b "$REDIS_URL" inspect ping -d "celery@${HOSTNAME:-$(hostname)}" -t 10'
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 15
          failureThreshold: 5
        # readinessProbe у воркера НЕТ намеренно: он не стоит ни за одним
        # Service, endpoint'ов не отдаёт, а вот rollout (`kubectl rollout status`
        # в deploy.sh, теперь блокирующий) начал бы ждать тот же ping и падать
        # по таймауту на медленном старте.
        # Лимиты приведены в соответствие с --concurrency (было: concurrency=4
        # при 256Mi/200m — конфигурация, которая не могла не OOM-иться).
        #
        # АРИФМЕТИКА ПАМЯТИ. celery prefork = 1 родитель + N детей, каждый
        # процесс тянет весь стек. Замер импорта `app.workers.tasks`:
        # ~166 MiB RSS на процесс ЕЩЁ ДО первой задачи (kubernetes-client +
        # sqlalchemy + anthropic sdk + opentelemetry + celery). Тот же порядок
        # независимо подтверждён beat'ом: он OOM-ился каждые ~10-13 мин на
        # 128Mi и поехал только на 256Mi (см. комментарий у copilot-beat ниже).
        # Copy-on-write здесь не экономит: refcounting CPython трогает заголовок
        # каждого объекта, и куча ребёнка расходится с родительской в первые
        # секунды работы.
        #   было:  concurrency=4 → 5 процессов × ~170Mi ≈ 850Mi baseline
        #          против limit 256Mi → OOMKill гарантирован, ещё до нагрузки.
        #   стало: concurrency=2 → 3 процесса × ~170Mi ≈ 510Mi baseline.
        # Сверху рабочая куча (SQLAlchemy-выборки по ~370 сервисам KG,
        # cluster-wide JSON от `kubectl get -A`) и сам kubectl — Go-бинарь,
        # он запускается subprocess'ом ВНУТРИ этого же cgroup и его RSS тоже
        # считается в лимит. 768Mi = 510Mi baseline + ~250Mi запаса.
        #
        # Почему не вариант «просто снизить concurrency»: он недостижим
        # в 256Mi арифметически — даже concurrency=1 это 2 × ~170Mi ≈ 340Mi,
        # а --pool=solo (один процесс) отдал бы весь воркер под один инцидент
        # на 30 минут (hard time limit), заморозив beat-таски, среди которых
        # kg-external-probe с тиком раз в минуту.
        #
        # CPU: было 200m на 5 процессов = 40m на процесс — throttling растягивал
        # стадии и подгонял их к soft time limit 1500s. 600m на 3 процесса =
        # 200m на процесс.
        #
        # requests == limits сохранены намеренно: Guaranteed QoS, воркер
        # выселяется последним. При acks_late (см. app/workers/tasks.py) OOM
        # больше не теряет задачу, но крутить OOM-петлю всё равно нельзя —
        # переотправка вернёт ту же задачу тому же лимиту.
        # Memory: 768Mi → 3Gi. На rc.13 (волна PR #228-#245) воркеры ловили
        # OOMKilled каждые ~1.5-2ч при живом лимите 1536Mi — суммарно 44
        # рестарта за 44ч на двух репликах (10.08.2026). Из-за OOM-петли ×
        # acks_late × expires=21600 дайджест daily_stats_digest два дня молча
        # протухал в очереди: воркер умирал, redis передоставлял через
        # visibility_timeout=1ч, к 15:00 UTC задача revoke-алась.
        resources:
          limits:
            cpu: 600m
            memory: 3Gi
          requests:
            cpu: 600m
            memory: 3Gi
        volumeMounts:
        # subPath: монтируется ОДИН файл, иначе /config затенил бы каталог.
        - name: ownership
          mountPath: /config/ownership.yaml
          subPath: ownership.yaml
          readOnly: true
        # readOnlyRootFilesystem: true выше означает, что писать некуда
        # вообще: без этого тома падает любая запись в /tmp, а её делают и
        # tempfile, и сборка .pyc. У beat такой том был, у воркера — нет.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: ownership
        configMap:
          name: sre-ai-copilot-ownership
      - name: tmp
        emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: copilot-worker-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: copilot-worker

---
# Celery beat — планировщик периодических задач (kg_topology_sync hourly и др.).
# ВСЕГДА replicas: 1 — несколько beat-инстансов будут дублировать задачи.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-beat
  labels:
    app: copilot-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copilot-beat
  strategy:
    type: Recreate   # при обновлении убиваем старый до старта нового — дубли недопустимы
  template:
    metadata:
      labels:
        app: copilot-beat
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      serviceAccountName: sre-ai
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: beat
        # IMAGE_PLACEHOLDER подставляет deploy.sh целиком (registry+repo+tag).
        # Registry задаётся через IMAGE_REPO — он разный по кластерам:
        # CI публикует в ghcr по git-sha, а WO-кластер тянет из Nexus
        # по тегу 1.0.0-rc.N. Хардкод ghcr здесь означал, что deploy.sh
        # в WO-кластере молча упирался в ImagePullBackOff.
        # CI публикует ТОЛЬКО :<git-sha> — тега :latest не существует.
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - app.workers.tasks.celery_app
        - beat
        - --loglevel=info
        - --scheduler=celery.beat:PersistentScheduler
        # /tmp writable ТОЛЬКО потому, что ниже смонтирован emptyDir: при
        # readOnlyRootFilesystem=true без volume beat падал на старте, не
        # сумев создать schedule-файл (крашлуп вместо планировщика).
        - --schedule=/tmp/celerybeat-schedule
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: ownership
          mountPath: /config/ownership.yaml
          subPath: ownership.yaml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        env:
        # ENV=production включает fail-closed-валидаторы в app/config.py
        # (обязательные секреты + запрет SAFE_MODE=false). Заполни secrets.yaml.
        - name: ENV
          value: "production"
        - name: SAFE_MODE
          value: "true"
        # ── дальше: то, что жило ТОЛЬКО в кластере ────────────────────────
        #
        # 21.08.2026: манифест и работающий Deployment разошлись полностью. В
        # git было две переменные и ни одного тома у воркера, в кластере —
        # пять других переменных, ConfigMap с ownership и emptyDir под /tmp.
        # Применение манифеста роняло поды на старте (config.py требовал
        # HMAC-секрет) и попутно отключило бы дайджест и ownership-backfill:
        # их дефолты в app/config.py — False.
        - name: ALERTMANAGER_ALLOW_UNAUTHENTICATED
          value: "true"
        - name: OWNERSHIP_MANIFEST_PATH
          value: /config/ownership.yaml
        # Подставляется deploy.sh из IMAGE_TAG; в кластере значение застыло
        # на 1.0.0-rc.29, потому что ставилось руками.
        - name: BUILD_VERSION
          value: "BUILD_VERSION_PLACEHOLDER"
        # Явный список namespace для kg_topology_sync. Дефолт в
        # app/config.py пустой, а пустой = auto-discovery: потеря этой
        # переменной сменила бы область сканирования целиком.
        #
        # Ревизия 21.08.2026: из 25 записей девять указывали на namespace,
        # которых в кластере нет. Убраны:
        #
        #   preprod-kingdom1, preprod-kingdom3, preupdate-kingdom1, preupdate-kingdom2, preupdate-kingdom3,
        #   squad-3-kingdom5, squad-11-kingdom2, squad-13-kingdom5, squad-19-shared
        #
        # Держать их в списке — не безобидно: синк ходит в несуществующий
        # namespace каждый тик, а `preprod-kingdom1` вдобавок оставался в
        # графе как namespace с db-узлами, на которые ссылались 3740 рёбер
        # (см. db_edge_rehome).
        #
        # Осталось 16 записей. Отдельный вопрос, который этой правкой
        # НЕ закрыт: в кластере 98 прикладных namespace (79 из них squad-*),
        # то есть 82 остаются вне обзора синка. Это та же слепая зона,
        # что описана в docstring namespace_lifecycle. Расширение охвата в
        # четыре раза требует замера — kg_topology_sync ходит per-namespace,
        # и OOM-и воркера в этом проекте уже случались.
        - name: KG_SCAN_NAMESPACES
          value: "preprod-kingdom2,preprod-shared,preupdate-kingdom5,preupdate-shared,prod-kingdom1,prod-kingdom2,prod-kingdom3,prod-kingdom4,prod-kingdom5,prod-lo-legal,prod-shared,squad-2-kingdom2,squad-3-shared,squad-9-kingdom2,squad-9-shared,squad-13-shared"
        # Дефолт False: periodic backfill team_owner.
        - name: OWNERSHIP_BACKFILL_ENABLED
          value: "true"
        # ── Liveness ─────────────────────────────────────────────────────────
        # У beat пробы тоже не было. Смерть процесса контейнер переживёт сам
        # (beat = PID 1, падение → рестарт), а вот ЗАВИСШИЙ планировщик —
        # это Running-под, который просто перестал тикать: ни одна периодическая
        # задача не ставится, KG протухает молча (тот же класс тишины, что
        # 1565 OOM-рестартов beat'а до 2026-06-24).
        #
        # Проверяем самое дешёвое, что доказывает «планировщик тикает»: свежесть
        # shelve-файла расписания. celery.beat.Scheduler.sync_every = 3*60 (см.
        # celery/beat.py), PersistentScheduler открывает shelve с writeback=True.
        # `celery inspect ping` здесь неприменим — у beat нет control-pidbox.
        #
        # ВАЖНАЯ ТОНКОСТЬ, проверенная экспериментом: sync вызывается НЕ по
        # таймеру, а из apply_entry — то есть только когда beat что-то отправил
        # (у beat'а с пустым beat_schedule файл не переписался ни разу за 13
        # минут). Значит порог должен покрывать не sync_every, а самый редкий
        # ГАРАНТИРОВАННЫЙ тик расписания. Сейчас это минутная kg-external-probe
        # (crontab(minute="*") — ставится независимо от EXTERNAL_PROBE_ENABLED,
        # флаг проверяется внутри таски), но если её однажды уберут, следующая по
        # частоте — */10, и порог 600s оказался бы ровно на границе. Отсюда 900s:
        # ×5 к sync_every, ×1.5 к десятиминутному тику, и всё равно вставший
        # цикл виден максимум за ~15 минут вместо бесконечной тишины.
        #
        # glob по префиксу, а НЕ точное имя: конкретный dbm-бэкенд решает, как
        # называть файл (_gdbm — ровно `celerybeat-schedule`, ndbm — `.db`,
        # dbm.dumb — `.dat`/`.dir`/`.bak`). Проверено: на ndbm файл появляется
        # как celerybeat-schedule.db, и проба по точному имени срабатывала бы
        # вечно и ложно → рестарт-петля здорового beat'а.
        #
        # Параметры: initialDelaySeconds=120 (импорт стека при cpu limit 100m —
        # это десятки секунд), periodSeconds=60, timeoutSeconds=10 (python -c
        # без импорта приложения — ~0.03s CPU), failureThreshold=3.
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import glob, os, sys, time
              paths = glob.glob("/tmp/celerybeat-schedule*")
              if not paths:
                  sys.exit("celerybeat-schedule missing: beat did not start the scheduler")
              age = int(time.time() - max(os.path.getmtime(p) for p in paths))
              if age >= 900:
                  sys.exit("celerybeat-schedule stale for %ds: beat loop wedged" % age)
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          limits:
            # 100m → 500m: при 100m beat ТРОТТЛИЛСЯ и терял тики. Замер
            # 19.08.2026 на живом поде: nr_periods 1647, nr_throttled 681 —
            # 41% периодов CFS. Следствие: `kg_external_probe` (расписание
            # «каждую минуту») уходил 4 раза за 20 минут вместо 20, а
            # `kg_self_health_check` не выполнялся ни разу за 6 часов.
            #
            # Средняя загрузка при этом всего 5.6% — беда не в объёме работы,
            # а в её форме: планировщик простаивает, потом должен разослать
            # залп задач в одну секунду, и на этом залпе 100m (десятая часть
            # ядра) не хватает. Пропущенный тик celery beat НЕ догоняет.
            #
            # Для планировщика 500m дёшево, а альтернатива — молча терять
            # расписание, включая собственную самопроверку.
            cpu: 500m
            # 128Mi → 256Mi: beat OOMKilled (exit 137) каждые ~10-13 мин (1565
            # рестартов на старом поде). Import-футпринт стека (kubernetes-client
            # + opentelemetry + sqlalchemy + anthropic + celery) не влезал в
            # 128Mi. beat — лёгкий планировщик в рантайме, 256Mi с запасом. 2026-06-24.
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      volumes:
      - name: ownership
        configMap:
          name: sre-ai-copilot-ownership
      # Writable /tmp под celerybeat-schedule (см. --schedule выше).
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
