apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-worker
  labels:
    app: copilot-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: copilot-worker
  template:
    metadata:
      labels:
        app: copilot-worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      serviceAccountName: sre-ai
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        # IMAGE_TAG_PLACEHOLDER подставляет deploy.sh (IMAGE_TAG=<git-sha>).
        # CI публикует ТОЛЬКО :<git-sha> — тега :latest не существует.
        # Pin по digest в CI: image: ghcr.io/froggychips/sre-ai-copilot@sha256:<digest>
        image: ghcr.io/froggychips/sre-ai-copilot:IMAGE_TAG_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - app.workers.tasks.celery_app
        - worker
        - --loglevel=info
        - --concurrency=4
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        env:
        # ENV=production включает fail-closed-валидаторы в app/config.py
        # (обязательные секреты + запрет SAFE_MODE=false). Заполни secrets.yaml.
        - name: ENV
          value: "production"
        - name: SAFE_MODE
          value: "true"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: copilot-worker-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: copilot-worker

---
# Celery beat — планировщик периодических задач (kg_topology_sync hourly и др.).
# ВСЕГДА replicas: 1 — несколько beat-инстансов будут дублировать задачи.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-beat
  labels:
    app: copilot-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copilot-beat
  strategy:
    type: Recreate   # при обновлении убиваем старый до старта нового — дубли недопустимы
  template:
    metadata:
      labels:
        app: copilot-beat
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: env
                    operator: In
                    values: ["dev"]
      serviceAccountName: sre-ai
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: beat
        # IMAGE_TAG_PLACEHOLDER подставляет deploy.sh (IMAGE_TAG=<git-sha>).
        # CI публикует ТОЛЬКО :<git-sha> — тега :latest не существует.
        image: ghcr.io/froggychips/sre-ai-copilot:IMAGE_TAG_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - app.workers.tasks.celery_app
        - beat
        - --loglevel=info
        - --scheduler=celery.beat:PersistentScheduler
        # /tmp writable ТОЛЬКО потому, что ниже смонтирован emptyDir: при
        # readOnlyRootFilesystem=true без volume beat падал на старте, не
        # сумев создать schedule-файл (крашлуп вместо планировщика).
        - --schedule=/tmp/celerybeat-schedule
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - secretRef:
            name: sre-ai-secrets
        env:
        # ENV=production включает fail-closed-валидаторы в app/config.py
        # (обязательные секреты + запрет SAFE_MODE=false). Заполни secrets.yaml.
        - name: ENV
          value: "production"
        - name: SAFE_MODE
          value: "true"
        resources:
          limits:
            cpu: 100m
            # 128Mi → 256Mi: beat OOMKilled (exit 137) каждые ~10-13 мин (1565
            # рестартов на старом поде). Import-футпринт стека (kubernetes-client
            # + opentelemetry + sqlalchemy + anthropic + celery) не влезал в
            # 128Mi. beat — лёгкий планировщик в рантайме, 256Mi с запасом. 2026-06-24.
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      volumes:
      # Writable /tmp под celerybeat-schedule (см. --schedule выше).
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
