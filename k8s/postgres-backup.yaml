apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-data
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Дамп 330 МБ при базе 5.5 ГБ (замер 19.08.2026). 20 ГБ — это 7 дампов
      # ретеншена с запасом на рост базы.
      storage: 20Gi

---
# pg_dump CronJob для single-replica Postgres из postgres.yaml.
#
# Если используется CloudNativePG (postgres.cnpg.yaml.example), бэкапы уже
# идут через barmanObjectStore + ScheduledBackup, и этот CronJob не нужен.
#
# Бакет / endpoint / credentials лежат в Secret `postgres-backup-s3`
# (создать через ExternalSecret из общего secret store).
#
# УСТРОЙСТВО: дамп и загрузка разнесены по контейнерам, потому что
# runAsUser=999 + readOnlyRootFilesystem=true исключают установку пакетов в
# рантайме (старый вариант `apk add aws-cli` падал первой же командой — job
# не отработал НИ РАЗУ, «RPO ≈ 24ч» был фикцией):
#   initContainer  pg-dump   (postgres:15-alpine)  → дамп в emptyDir /backup
#   container      s3-upload (amazon/aws-cli)      → aws s3 cp из /backup
# Падение любого из них = Failed Job → алерт SREAICopilotPostgresBackup*
# (см. k8s/prometheus-rules.yaml).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  # Ежедневно в 02:00 UTC. RPO ≈ 24ч — задокументировано в docs/DR.md.
  # Для меньшего RPO — PITR через WAL (cnpg.yaml.example).
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          initContainers:
          - name: pg-dump
            image: postgres:15-alpine
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
            - name: PGHOST
              value: "postgres"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            command:
            - /bin/sh
            - -ec
            - |
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              dump_file="/backup/sre-ai-${PGDATABASE}-${ts}.sql.gz"
              echo "Dumping ${PGDATABASE} -> ${dump_file}"
              pg_dump --format=custom --no-owner --no-privileges \
                  --compress=9 \
                  --file="${dump_file%.gz}" "${PGDATABASE}"
              gzip "${dump_file%.gz}"
              # Имя файла для upload-контейнера (basename, без пути).
              basename "${dump_file}" > /backup/LATEST
              echo "Dump complete: $(basename "${dump_file}")"

              # Ретеншен: держим последние KEEP дампов. Без него том заполнится
              # молча, и первым сломается именно бэкап — то, что должно
              # работать, когда сломалось всё остальное.
              KEEP=${BACKUP_KEEP:-7}
              ls -1t /backup/sre-ai-*.sql.gz 2>/dev/null | tail -n +$((KEEP + 1)) | while read -r old; do
                echo "Retention: removing $(basename "$old")"
                rm -f "$old"
              done
              echo "Kept: $(ls -1 /backup/sre-ai-*.sql.gz 2>/dev/null | wc -l) dumps, free: $(df -h /backup | tail -1 | awk '{print $4}')"
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
          containers:
          - name: s3-upload
            # aws-cli уже внутри образа — НИКАКИХ установок в рантайме
            # (readOnlyRootFilesystem это и не позволит).
            image: amazon/aws-cli:2.17.52
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
            # aws-cli пишет кэш/конфиг в $HOME — направляем во writable emptyDir.
            - name: HOME
              value: "/tmp"
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: BUCKET
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: REGION
                  optional: true
            command:
            - /bin/sh
            - -ec
            - |
              dump_name="$(cat /backup/LATEST)"

              # Выгрузка наружу — ВТОРАЯ линия защиты, а не единственная.
              # Локальный дамп уже сделан init-контейнером и лежит на
              # постоянном томе. Если секрета postgres-backup-s3 нет, ронять
              # Job нельзя: это превратило бы работающий локальный бэкап в
              # «бэкапа нет» — ровно то состояние, в котором система прожила
              # год до 19.08.2026.
              if [ -z "${S3_BUCKET:-}" ]; then
                echo "S3_BUCKET не задан — выгрузка пропущена."
                echo "Локальный дамп: /backup/${dump_name} (том postgres-backup-data)."
                echo "ВНИМАНИЕ: том привязан к ноде, потеря ноды = потеря дампа."
                echo "Чтобы включить выгрузку, создай секрет postgres-backup-s3"
                echo "с ключами BUCKET / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / REGION."
                exit 0
              fi

              echo "Uploading /backup/${dump_name} -> s3://${S3_BUCKET}/postgres/"
              aws s3 cp "/backup/${dump_name}" "s3://${S3_BUCKET}/postgres/${dump_name}"
              echo "Backup complete: ${dump_name}"
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: backup
            # ПОСТОЯННЫЙ том вместо emptyDir. Схема здесь двухступенчатая:
            # init-контейнер pg-dump пишет дамп, основной s3-upload выгружает
            # его наружу. При emptyDir дамп жил только между этими шагами — и
            # если S3-секрета нет (а его нет), не оставалось ничего.
            #
            # Проверено 19.08.2026: pg_dump отработал за 5.5 минут, дамп 330 МБ
            # при базе 5.5 ГБ. Теперь он сохраняется независимо от выгрузки.
            #
            # Ограничение: StorageClass local-path привязывает том к ноде.
            # Это защита от повреждения базы, ошибочного DROP и неудачной
            # миграции, но НЕ от потери ноды. Выгрузка в S3 остаётся нужной —
            # для неё не хватает секрета postgres-backup-s3.
            persistentVolumeClaim:
              claimName: postgres-backup-data
          - name: tmp
            emptyDir:
              sizeLimit: 128Mi
