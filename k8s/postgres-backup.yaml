# pg_dump CronJob для single-replica Postgres из postgres.yaml.
#
# Если используется CloudNativePG (postgres.cnpg.yaml.example), бэкапы уже
# идут через barmanObjectStore + ScheduledBackup, и этот CronJob не нужен.
#
# Бакет / endpoint / credentials лежат в Secret `postgres-backup-s3`
# (создать через ExternalSecret из общего secret store).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  # Ежедневно в 02:00 UTC. RPO ≈ 24ч — задокументировано в docs/DR.md.
  # Для меньшего RPO — PITR через WAL (cnpg.yaml.example).
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
          - name: pg-dump
            image: postgres:15-alpine
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
            - name: PGHOST
              value: "postgres"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-s3
                  key: REGION
            command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache aws-cli
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              dump_file="/tmp/sre-ai-${PGDATABASE}-${ts}.sql.gz"
              echo "Dumping ${PGDATABASE} → ${dump_file}"
              pg_dump --format=custom --no-owner --no-privileges \
                  --compress=9 \
                  --file="${dump_file%.gz}" "${PGDATABASE}"
              gzip "${dump_file%.gz}"
              echo "Uploading to s3://${S3_BUCKET}/postgres/"
              aws s3 cp "${dump_file}" "s3://${S3_BUCKET}/postgres/$(basename ${dump_file})"
              echo "Backup complete: $(basename ${dump_file})"
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 5Gi
