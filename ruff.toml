# Явный контракт линта.
#
# До 2026-07-31 конфига не было вообще: `ruff check .` брал встроенный
# дефолтный набор правил, а `pip install ruff` в ci.yml шёл без пина.
# Держалось это на переиспользуемом .venv в рабочем каталоге раннера
# (clean: false) — pip видел «Requirement already satisfied: ruff (0.15.20)»
# и не обновлял. Когда venv пересоздался, приехала ruff 0.16.1 с сильно
# расширенными дефолтами: тот же код, 0 → 2659 ошибок, весь CI встал.
#
# Отсюда правило: объём проверки задаётся здесь и меняется только коммитом,
# а не релизом ruff. Версия дополнительно запинена в .github/workflows/ci.yml.
target-version = "py312"

exclude = [
    # Кеш плагинов Claude Code: untracked, в CI отсутствует, но при локальном
    # `ruff check .` даёт десятки тысяч ошибок из чужого кода и полностью
    # прячет реальные. Без этого локальный прогон не сверить с CI.
    ".claude",
]

[lint]
# Ровно то, что фактически проверялось на последнем зелёном прогоне
# (ruff 0.15.20, дефолтный набор): pycodestyle-ошибки + pyflakes.
# Расширять осознанно и отдельным PR — на 2026-07-31 включение дефолтов
# ruff 0.16 стоит 2659 находок (UP006 1072, UP045 572, BLE001 250, UP035 221,
# I001 157, DTZ 170, ...), из них 1887 автофиксятся.
select = ["E4", "E7", "E9", "F"]
