# Явный контракт линта.
#
# До 2026-07-31 конфига не было вообще: `ruff check .` брал встроенный
# дефолтный набор правил, а `pip install ruff` в ci.yml шёл без пина.
# Держалось это на переиспользуемом .venv в рабочем каталоге раннера
# (clean: false) — pip видел «Requirement already satisfied: ruff (0.15.20)»
# и не обновлял. Когда venv пересоздался, приехала ruff 0.16.1 с сильно
# расширенными дефолтами: тот же код, 0 → 2659 ошибок, весь CI встал.
#
# Отсюда правило: объём проверки задаётся здесь и меняется только коммитом,
# а не релизом ruff. Версия дополнительно запинена в .github/workflows/ci.yml.

# target-version ОБЯЗАН совпадать с python в Dockerfile (единственный источник
# истины по рантайму) и с python_version в mypy.ini. Держит их вместе
# tests/test_ops_manifests.py::test_python_version_is_consistent_across_toolchain.
#
# До этого здесь стоял py312 при `FROM python:3.11-slim` — линт разрешал
# 3.12-only синтаксис (PEP 695 `type X = ...`, generic-параметры у def/class,
# f-строки по PEP 701), который в проде падал бы SyntaxError на импорте, то есть
# CrashLoopBackOff всего деплоймента, а не «ошибка в одном хендлере».
#
# Почему опустили линт до 3.11, а не подняли образ до 3.12: рантайм в
# prod-выкате — самая дорогая для откатa часть (новый интерпретатор = новые
# колёса для grpcio/psycopg2/pydantic-core/uvloop, и проверить это можно только
# сборкой образа), а статические гейты обязаны описывать существующий прод, а не
# намерение. Подъём базового образа — отдельная задача с прогоном сборки.
# ХВОСТ: pytest в CI гоняется на homebrew python3.12 (.github/workflows/ci.yml),
# то есть тесты по-прежнему исполняются не на той версии, что прод. Это
# отдельный дефект (не правится этим конфигом) — либо CI на 3.11, либо образ на
# 3.12; после решения обновить обе строки и Dockerfile разом.
target-version = "py311"

exclude = [
    # Кеш плагинов Claude Code: untracked, в CI отсутствует, но при локальном
    # `ruff check .` даёт десятки тысяч ошибок из чужого кода и полностью
    # прячет реальные. Без этого локальный прогон не сверить с CI.
    ".claude",
]

[lint]
# Ровно то, что фактически проверялось на последнем зелёном прогоне
# (ruff 0.15.20, дефолтный набор): pycodestyle-ошибки + pyflakes.
# Расширять осознанно и отдельным PR — на 2026-07-31 включение дефолтов
# ruff 0.16 стоит 2659 находок (UP006 1072, UP045 572, BLE001 250, UP035 221,
# I001 157, DTZ 170, ...), из них 1887 автофиксятся.
select = ["E4", "E7", "E9", "F"]
