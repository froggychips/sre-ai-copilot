replicaCount:
  api: 2
  worker: 2

image:
  # CI публикует ТОЛЬКО ghcr.io/froggychips/sre-ai-copilot:<git-sha>
  # (см. .github/workflows/ci.yml) — тега :latest НЕ СУЩЕСТВУЕТ.
  # tag обязателен: --set image.tag=<git-sha>; шаблоны падают через
  # `required`, если не задан. Раньше здесь стояли repository без ghcr.io
  # (docker hub!) и tag latest — свежий install гарантированно получал
  # ImagePullBackOff.
  repository: ghcr.io/froggychips/sre-ai-copilot
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # Create the ServiceAccount
  create: true
  # Annotations to add to the service account (e.g. IRSA)
  annotations: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  host: sre-ai.example.com
  # oauth2-proxy domain (e.g. auth.example.com)
  authDomain: auth.example.com
  tls:
    secretName: sre-ai-tls

redis:
  image: redis:7-alpine
  storage: 10Gi
  maxmemory: "256mb"
  maxmemoryPolicy: allkeys-lru

resources:
  api:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  worker:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 256Mi
  redis:
    limits:
      cpu: 500m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 256Mi

env:
  llmBackend: anthropic
  logLevel: info

  # appEnv=production включает fail-closed-валидаторы в app/config.py:
  # обязательные ALERTMANAGER_WEBHOOK_SECRET / JWT_PUBLIC_KEY / непустой
  # DATABASE_URL без placeholder + запрет SAFE_MODE=false в prod. Это
  # намеренное поведение — чарт предназначен для кластерного деплоя, поэтому
  # дефолт production. Оператор ОБЯЗАН заполнить secret.yaml до установки,
  # иначе pod упадёт на старте (fail-closed by design).
  appEnv: "production"

  # Set to "true" to enable safe-mode (disables write k8s actions)
  safeMode: "true"

  # Executor track (v0.7.0+). По дефолту оба false — пайплайн чисто advisory.
  # Включать постепенно по ramp-up-плану (см. README → Roadmap → Execution):
  #   1. dev / single preprod-squad-N: оба true, DISCORD_DRY_RUN=true для smoke
  #   2. все preprod-squad-*: оба true, watch rate EXECUTOR_APPLY_REFUSED
  #   3. prod-squad-N: оба true
  #   4. all prod-squad-*: оба true
  # HIGH-risk auto-apply никогда (by design — режется в apply-service).
  executorEnabled: "false"          # 9-я стадия: kubectl --dry-run=server
  executorApprovalEnabled: "false"  # Apply-кнопка на Discord embed → реальный kubectl

  # Daily Discord stats digest (Celery beat task daily_stats_digest).
  # Pure data-aggregation, БЕЗ LLM-вызовов. Шлёт в DISCORD_WEBHOOK_STATS_URL.
  # См. tests/test_stats_digest_no_llm.py — инвариант что LLM не дёргается.
  statsDigestEnabled: "false"
  statsDigestHourUtc: "9"           # ежедневно в HH:00 UTC
  statsDigestStaleDays: "14"        # threshold для stale-deployment секции

  # External probe: DNS+TCP+HTTPS на synthetic ingress:<host> узлы из KG
  # (источник — k8s_ingress_sync). Beat task kg-external-probe каждую минуту,
  # алерты в DISCORD_WEBHOOK_URL. Default off — включается после смоук-прогона
  # (внутри pod: python -m app.knowledge_graph.external_probe_sync).
  externalProbeEnabled: "false"
  externalProbeFailThreshold: "3"   # сколько подряд fail-ов до alert (anti-flap)
  externalProbeTimeoutSeconds: "5"

  # Periodic ownership backfill (Celery beat task kg-ownership-backfill,
  # every 6h at minute=17). Прогоняет multi-signal owner inference по сервисам
  # без team_owner и применяет high-confidence-кандидатов.
  # Threshold для beat-режима стоит выше чем для initial ручного backfill
  # (0.7 vs 0.4) — periodic работает без human review и не должен делать
  # low-confidence updates. Detail: docs/RUNBOOK.md → "Periodic ownership backfill".
  ownershipBackfillEnabled: "true"
  ownershipBackfillThreshold: "0.7"

  # Путь внутри pod, по которому worker/api читают shared-infra ownership
  # manifest (`OWNERSHIP_MANIFEST_PATH`). Mount-ится через ConfigMap
  # `<fullname>-ownership` (см. templates/ownership-configmap.yaml). Сам
  # манифест живёт в `helm/sre-ai-copilot/files/ownership.yaml` (копия
  # `config/ownership.yaml`). Detail: docs/RUNBOOK.md § "Activate *-shared
  # ownership manifest in runtime".
  ownershipManifestPath: "/config/ownership.yaml"

# Shared-infra ownership manifest (PR #96 — 14 правил, 132/132 *-shared
# сервиса). Cm рендерится из `helm/sre-ai-copilot/files/ownership.yaml`,
# mount-ится в worker/api как read-only subPath по
# `env.ownershipManifestPath`. Выключить можно через
# `--set ownershipManifest.enabled=false` — тогда worker откатывается на
# чистые multi-signal heuristics (prefix/deploy-history/labels) и 132
# *-shared сервиса снова становятся unowned.
ownershipManifest:
  enabled: true

# All secret keys — fill in before deploying.
# In production prefer SealedSecrets or ExternalSecrets (see k8s/base/secrets.*.yaml.example).
secrets:
  anthropicApiKey: ""
  databaseUrl: ""
  redisUrl: ""
  discordWebhookUrl: ""
  alertmanagerWebhookSecret: ""
  jwtPublicKey: ""
  jiraBaseUrl: ""
  jiraEmail: ""
  jiraApiToken: ""
