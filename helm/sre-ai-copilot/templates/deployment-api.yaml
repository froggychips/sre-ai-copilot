apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sre-ai-copilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sre-ai-copilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "sre-ai-copilot.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sre-ai-copilot.podSecurityContext" . | nindent 8 }}
      containers:
      - name: api
        # Pin по digest в CI: image: ghcr.io/froggychips/sre-ai-copilot@sha256:<digest>
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        securityContext:
          {{- include "sre-ai-copilot.containerSecurityContext" . | nindent 10 }}
        envFrom:
        - secretRef:
            name: {{ include "sre-ai-copilot.secretName" . }}
        env:
        - name: LLM_BACKEND
          value: {{ .Values.env.llmBackend | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.logLevel | quote }}
        - name: SAFE_MODE
          value: {{ .Values.env.safeMode | quote }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          # /readyz делает SELECT 1 к Postgres (см. app/main.py:readyz).
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          # До 60 секунд на старт — достаточно для миграции БД и init-overhead.
          periodSeconds: 5
          failureThreshold: 12
        resources:
          {{- toYaml .Values.resources.api | nindent 10 }}
