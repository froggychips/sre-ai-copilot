apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-redis-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
data:
  redis.conf: |
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy {{ .Values.redis.maxmemoryPolicy }}
    # AOF — append-only file. Каждая запись фьюшится на диск через
    # everysec. На рестарте Redis восстанавливает state из AOF.
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    # RDB snapshot как страховка (1 раз в час при изменениях).
    save 3600 1
