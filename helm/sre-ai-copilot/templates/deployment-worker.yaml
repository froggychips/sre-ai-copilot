apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sre-ai-copilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sre-ai-copilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "sre-ai-copilot.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sre-ai-copilot.podSecurityContext" . | nindent 8 }}
      containers:
      - name: worker
        # Pin по digest в CI: image: ghcr.io/froggychips/sre-ai-copilot@sha256:<digest>
        image: "{{ .Values.image.repository }}:{{ required "image.tag обязателен (CI публикует только :<git-sha>, тега :latest нет)" .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - celery
        - -A
        # app.workers.tasks — боевое Celery-приложение (все kg_*-syncs,
        # дайджесты, pipeline; то же, что в k8s/worker.yaml).
        # Ранее стоял app.celery_worker (одна task generate_reply) — chart-
        # worker не обрабатывал НИ ОДНОЙ инцидентной задачи.
        - app.workers.tasks.celery_app
        - worker
        - --loglevel=info
        # --concurrency ОБЯЗАТЕЛЕН явно. Без него celery берёт os.cpu_count()
        # НОДЫ, а не cpu-лимит контейнера: на 32-ядерной dev-ноде это 33
        # процесса × ~170Mi import-футпринта в лимите resources.worker.memory.
        # Значение синхронизировано с k8s/worker.yaml — арифметика «сколько
        # процессов × сколько памяти» расписана там же, в комментарии к
        # resources. Менять concurrency и resources.worker только вместе.
        - --concurrency={{ .Values.worker.concurrency }}
        securityContext:
          {{- include "sre-ai-copilot.containerSecurityContext" . | nindent 10 }}
        envFrom:
        - secretRef:
            name: {{ include "sre-ai-copilot.secretName" . }}
        env:
        - name: LLM_BACKEND
          value: {{ .Values.env.llmBackend | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.logLevel | quote }}
        - name: SAFE_MODE
          value: {{ .Values.env.safeMode | quote }}
        - name: ENV
          value: {{ .Values.env.appEnv | quote }}
        - name: EXECUTOR_ENABLED
          value: {{ .Values.env.executorEnabled | default "false" | quote }}
        - name: EXECUTOR_APPROVAL_ENABLED
          value: {{ .Values.env.executorApprovalEnabled | default "false" | quote }}
        - name: STATS_DIGEST_ENABLED
          value: {{ .Values.env.statsDigestEnabled | default "false" | quote }}
        - name: STATS_DIGEST_HOUR_UTC
          value: {{ .Values.env.statsDigestHourUtc | default "9" | quote }}
        - name: STATS_DIGEST_STALE_DAYS
          value: {{ .Values.env.statsDigestStaleDays | default "14" | quote }}
        - name: EXTERNAL_PROBE_ENABLED
          value: {{ .Values.env.externalProbeEnabled | default "false" | quote }}
        - name: EXTERNAL_PROBE_FAIL_THRESHOLD
          value: {{ .Values.env.externalProbeFailThreshold | default "3" | quote }}
        - name: EXTERNAL_PROBE_TIMEOUT_SECONDS
          value: {{ .Values.env.externalProbeTimeoutSeconds | default "5" | quote }}
        - name: OWNERSHIP_BACKFILL_ENABLED
          value: {{ .Values.env.ownershipBackfillEnabled | default "false" | quote }}
        - name: OWNERSHIP_BACKFILL_THRESHOLD
          value: {{ .Values.env.ownershipBackfillThreshold | default "0.7" | quote }}
        {{- if .Values.ownershipManifest.enabled }}
        - name: OWNERSHIP_MANIFEST_PATH
          value: {{ .Values.env.ownershipManifestPath | default "/config/ownership.yaml" | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources.worker | nindent 10 }}
        {{- if .Values.ownershipManifest.enabled }}
        volumeMounts:
        - name: ownership-manifest
          mountPath: {{ .Values.env.ownershipManifestPath | default "/config/ownership.yaml" | quote }}
          subPath: ownership.yaml
          readOnly: true
        {{- end }}
      {{- if .Values.ownershipManifest.enabled }}
      volumes:
      - name: ownership-manifest
        configMap:
          name: {{ include "sre-ai-copilot.fullname" . }}-ownership
      {{- end }}
