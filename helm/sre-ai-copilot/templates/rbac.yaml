{{- if .Values.serviceAccount.create }}
# RBAC для sre-ai (api + worker).
#
# Принципы:
#   * ОТКАЗ default-SA: pod-ы используют sre-ai SA с явным набором прав.
#   * Чтение — широкое (pod/pod log/event/deployment в текущем namespace).
#   * Запись — только то, что реально дёргает agent fix/synthesis:
#       - deployments rollout (patch/scale)
#       - pod eviction (delete)
#   * forbidden ns (kube-system, kube-public, kube-node-lease, chaos-mesh, mcp)
#     не покрываются НИЧЕМ — guard в коде дополнительно блокирует, но и API
#     уровень тоже отрезан.

---
# Read-only Role — применяется в namespace релиза.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-read
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-read
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "sre-ai-copilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "sre-ai-copilot.fullname" . }}-read
  apiGroup: rbac.authorization.k8s.io

---
# Write-Role — применяется ТОЛЬКО в squad-* namespace-ах (через отдельный
# RoleBinding) и ТОЛЬКО на SA исполнителя. Не делать ClusterRoleBinding —
# иначе обходим principle of least privilege.
#
# Живой путь деплоя — deploy.sh + k8s/ (чарт не source of truth). Там запись
# исполняет отдельный deployment copilot-executor под SA sre-ai-executor
# (k8s/executor.yaml, k8s/base/rbac.yaml), а SA приложения — только чтение.
# В чарте executor-а пока нет: пока его не добавят, эту роль НЕ привязывать
# к serviceAccountName чарта — тот же SA у api, принимающего вебхуки.
#
# Состав — ровно то, что умеет execution_dsl (rollout restart, scale);
# `delete pods` и `create pods/exec` сняты 24.09.2026 — ни один путь кода их
# не вызывал.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-remediate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]

---
# ClusterRole: read-only на deployments / services / ingresses cluster-wide.
# Нужен kg_topology_sync (env-scan, hourly) + Wave 7 / G1.3
# kg_topology_resources_sync (declarative Service.spec.selector +
# Ingress.spec.rules → ServiceEdge graph, каждые 15 мин).
# Только get/list/watch — write не затронут.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-cluster-reader
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
rules:
- apiGroups: ["apps"]
  # statefulsets/daemonsets — те же, что в k8s/base/rbac.yaml. Здесь их не
  # было: чарт остался на одних deployments, то есть в helm-развёртывании
  # Service, за которым стоит БД, не матчился ни на что — ровно тот дефект,
  # который в base закрыли 08.08.2026 (2231 промах за тик).
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
# CNPG: поды кластера создаёт оператор из Cluster CR, и без чтения этого
# ресурса Service `*-cnpg-rw` не матчится ни на один workload. Замер
# 17.09.2026: живой primary config-worker-db-cnpg не был представлен в графе
# вообще, а оставленный для отката StatefulSet — был.
#
# Права здесь ОБЯЗАТЕЛЬНЫ именно потому, что их отсутствие не видно:
# `_kubectl_get_all` превращает Forbidden в пустой список, то есть синк не
# упадёт и не залогирует ошибку — он просто никогда не найдёт ни одного
# кластера, и фикс топологии молча не заработает.
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch"]
# `namespaces` cluster-wide list — auto-discovery non-system ns в
# kg_sync.discover_namespaces() и drift_cleanup.fetch_live_namespaces().
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
# KG Coverage #1: k8s Job + CronJob → kg_k8s_jobs. Cluster-wide read
# нужен для backup-CronJob'ов в `*-shared` ns + alembic-Job'ов в ns
# деплоя. pods нужны для resolve last_pod_exit_code у Failed Job'ов
# (label-selector job-name=<name>) — уже покрыты ниже общим правилом
# для storage scan.
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
# KG Coverage #2 (storage signals): k8s_storage_sync (PVC/PV cluster-wide
# + pod scan для uses_volume edges; ReplicaSets — Pod→Deployment chain).
# pods cluster-wide объединены с #1.
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-cluster-reader
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "sre-ai-copilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "sre-ai-copilot.fullname" . }}-cluster-reader
  apiGroup: rbac.authorization.k8s.io

{{- end }}
