apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-ai-copilot.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.secrets.discordWebhookUrl | quote }}
  ALERTMANAGER_WEBHOOK_SECRET: {{ .Values.secrets.alertmanagerWebhookSecret | quote }}
  JWT_PUBLIC_KEY: {{ .Values.secrets.jwtPublicKey | quote }}
  JIRA_BASE_URL: {{ .Values.secrets.jiraBaseUrl | quote }}
  JIRA_EMAIL: {{ .Values.secrets.jiraEmail | quote }}
  JIRA_API_TOKEN: {{ .Values.secrets.jiraApiToken | quote }}
