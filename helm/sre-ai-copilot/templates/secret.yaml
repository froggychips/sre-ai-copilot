{{- /*
⚠️ VALUES-ПУТЬ ДЛЯ СЕКРЕТОВ. Небезопасен по устройству, поэтому опционален и
шумит в NOTES.txt. Что именно с ним не так:
  * значения из values попадают в helm release Secret (sh.helm.release.v1.<rel>.vN
    — это gzip+base64 всего рендера, читается любым, у кого есть get secret в ns,
    и хранится ПО ВЕРСИЯМ: ротация ключа не убирает старый из истории релизов);
  * `--set secrets.anthropicApiKey=...` оседает в shell history и в argv
    (виден в `ps` всем на машине), а -f values-prod.yaml — в git при первой
    невнимательности.
Поэтому в prod: создать Secret вне чарта (SealedSecrets / ExternalSecrets — см.
k8s/base/secrets.*.yaml.example) и передать `--set secrets.existingSecret=<name>`.
Тогда этот шаблон не рендерится вовсе, а все envFrom ссылаются на внешний Secret
(подмена одна — helper sre-ai-copilot.secretName).

Второе изменение против прежней версии: рендерим ТОЛЬКО непустые ключи. Раньше
все девять шли в stringData всегда, в том числе как "" — и `helm upgrade` с
пустыми values ЗАТИРАЛ пустотой то, что оператор до этого вписал руками
(NOTES.txt сам предлагал `kubectl edit secret`). helm.sh/resource-policy: keep
от этого не спасает: он про удаление при uninstall, а не про перезапись при
upgrade. Тот же класс мины, что `kubectl apply -f k8s/base/secrets.yaml` с
REPLACE_ME в deploy.sh — там его уже убрали.

ВНИМАНИЕ при переходе на этот чарт-ревизион: ключи, которые прошлый рендер
записал как "" и которые оператор потом заполнил руками, для helm существуют в
old-манифесте → 3-way merge удалит их при первом upgrade. Правильный путь
перехода — сразу перевести релиз на secrets.existingSecret.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $candidates := dict
      "ANTHROPIC_API_KEY" .Values.secrets.anthropicApiKey
      "DATABASE_URL" .Values.secrets.databaseUrl
      "REDIS_URL" .Values.secrets.redisUrl
      "DISCORD_WEBHOOK_URL" .Values.secrets.discordWebhookUrl
      "ALERTMANAGER_WEBHOOK_SECRET" .Values.secrets.alertmanagerWebhookSecret
      "JWT_PUBLIC_KEY" .Values.secrets.jwtPublicKey
      "JIRA_BASE_URL" .Values.secrets.jiraBaseUrl
      "JIRA_EMAIL" .Values.secrets.jiraEmail
      "JIRA_API_TOKEN" .Values.secrets.jiraApiToken }}
{{- $provided := dict }}
{{- range $key, $value := $candidates }}
{{- if $value }}
{{- $_ := set $provided $key $value }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-ai-copilot.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
  annotations:
    # keep = uninstall не унесёт секреты вместе с релизом (а вместе с ними —
    # DATABASE_URL действующей БД). Про upgrade см. комментарий выше.
    helm.sh/resource-policy: keep
type: Opaque
{{- if $provided }}
stringData:
  {{- toYaml $provided | nindent 2 }}
{{- else }}
# Ни один ключ не задан в values (штатно для `helm template`/`helm lint` и для
# первого install-а перед заполнением). Secret рендерится пустым намеренно:
# поды упрутся в fail-closed валидаторы app/config.py на старте, а не поедут
# в прод с наполовину пустой конфигурацией.
{{- end }}
{{- end }}
