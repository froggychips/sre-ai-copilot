# Celery beat — планировщик периодических задач (kg_topology_sync, дайджесты,
# resolve-sync и все прочие beat_schedule-задачи из app/workers/tasks.py).
# До 2026-08-07 этого шаблона в чарте НЕ БЫЛО — chart-install поднимал api и
# worker, но ни одна периодическая задача не запускалась (KG молча протухал).
# ВСЕГДА replicas: 1 — несколько beat-инстансов дублируют задачи.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-ai-copilot.fullname" . }}-beat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy:
    type: Recreate   # при обновлении убиваем старый до старта нового — дубли недопустимы
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sre-ai-copilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sre-ai-copilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: {{ include "sre-ai-copilot.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sre-ai-copilot.podSecurityContext" . | nindent 8 }}
      containers:
      - name: beat
        image: "{{ .Values.image.repository }}:{{ required "image.tag обязателен (CI публикует только :<git-sha>, тега :latest нет)" .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - celery
        - -A
        - app.workers.tasks.celery_app
        - beat
        - --loglevel=info
        - --scheduler=celery.beat:PersistentScheduler
        # /tmp writable только благодаря emptyDir ниже: при
        # readOnlyRootFilesystem=true без volume beat крашлупит на старте,
        # не сумев создать schedule-файл (та же мина была в k8s/worker.yaml).
        - --schedule=/tmp/celerybeat-schedule
        securityContext:
          {{- include "sre-ai-copilot.containerSecurityContext" . | nindent 10 }}
        envFrom:
        - secretRef:
            name: {{ include "sre-ai-copilot.secretName" . }}
        env:
        - name: LLM_BACKEND
          value: {{ .Values.env.llmBackend | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.logLevel | quote }}
        - name: SAFE_MODE
          value: {{ .Values.env.safeMode | quote }}
        - name: ENV
          value: {{ .Values.env.appEnv | quote }}
        - name: STATS_DIGEST_ENABLED
          value: {{ .Values.env.statsDigestEnabled | default "false" | quote }}
        - name: STATS_DIGEST_HOUR_UTC
          value: {{ .Values.env.statsDigestHourUtc | default "9" | quote }}
        - name: STATS_DIGEST_STALE_DAYS
          value: {{ .Values.env.statsDigestStaleDays | default "14" | quote }}
        - name: EXTERNAL_PROBE_ENABLED
          value: {{ .Values.env.externalProbeEnabled | default "false" | quote }}
        - name: OWNERSHIP_BACKFILL_ENABLED
          value: {{ .Values.env.ownershipBackfillEnabled | default "false" | quote }}
        resources:
          limits:
            cpu: 100m
            # 256Mi: import-футпринт стека (kubernetes-client + otel +
            # sqlalchemy + anthropic + celery) не влезает в 128Mi —
            # см. историю OOM в k8s/worker.yaml.
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
