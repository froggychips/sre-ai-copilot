name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint and Test
    # Self-hosted runner (jabbook-air-m3-sre-copilot) because the froggychips
    # account is currently blocked from GitHub-hosted runners on a billing
    # issue. macOS arm64; Python 3.12 chosen because psycopg2-binary 2.9.9
    # has prebuilt wheels for macosx_11_0_arm64 starting from cp312, not cp311.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Ruff and Mypy are non-blocking right now — the repo carries
      # 27 ruff and 69 mypy errors of pre-existing lint debt. The
      # test gate is pytest below. Cleanup of lint/type debt is
      # tracked separately.
      - name: Run Ruff (Linting)
        continue-on-error: true
        run: ruff check .

      - name: Run Mypy (Type Checking)
        continue-on-error: true
        run: mypy .

      - name: Run Pytest with Coverage
        run: pytest --cov=app --cov-report=xml

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
