name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint and Test
    # Self-hosted runner (jabbook-air-m3-sre-copilot) because the froggychips
    # account is currently blocked from GitHub-hosted runners on a billing
    # issue. macOS arm64; we use the homebrew-installed Python 3.12 directly
    # instead of actions/setup-python — that action assumes GitHub-hosted
    # paths (/Users/runner) that don't exist on a self-hosted setup.
    # Python 3.12 chosen because psycopg2-binary 2.9.9 has prebuilt wheels
    # for macosx_11_0_arm64 starting from cp312.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Show Python version
        run: /opt/homebrew/bin/python3.12 --version

      - name: Create venv and install dependencies
        run: |
          /opt/homebrew/bin/python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ruff mypy pytest pytest-cov pytest-asyncio pytest-mock bandit pip-audit
          if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; fi

      # Ruff and Mypy are non-blocking right now — the repo carries
      # 27 ruff and 69 mypy errors of pre-existing lint debt. The
      # test gate is pytest below. Cleanup of lint/type debt is
      # tracked separately.
      - name: Run Ruff (Linting)
        continue-on-error: true
        run: .venv/bin/ruff check .

      - name: Run Mypy (Type Checking)
        continue-on-error: true
        run: .venv/bin/mypy .

      # Coverage gate. Текущий baseline после Э4.* — 58%. Gate с буфером в 3%
      # на флуктуации. Поднимать вручную при росте покрытия.
      - name: Run Pytest with Coverage
        run: .venv/bin/pytest --cov=app --cov-report=xml --cov-fail-under=55

      # bandit — статический security-скан кода. Игнорируем low/info,
      # фейлим только на medium+. Известные исключения добавлять в
      # .bandit/.bandit.yml, а не понижать порог.
      - name: Bandit (security static analysis)
        run: .venv/bin/bandit -r app -q --severity-level medium

      # pip-audit — известные CVE в зависимостях. Не блокируем job,
      # пока в долге pre-existing уязвимости; репортим в логах.
      # Перевести в blocking, когда долг будет нулевой.
      - name: pip-audit (dependency CVEs)
        continue-on-error: true
        run: .venv/bin/pip-audit --requirement requirements.txt --strict

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC для cosign keyless

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Не публикуем :latest — в k8s pin по digest. Перетягиваем тег
          # ${{ github.sha }} вручную через retag при релизе, чтобы избежать
          # race "deployment пришёл, а :latest уже новый".

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign image (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX)
        run: |
          syft "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json > sbom.spdx.json

      - name: Cosign attach SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
