name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint and Test
    # Self-hosted runner (jabbook-air-m3-sre-copilot) because the froggychips
    # account is currently blocked from GitHub-hosted runners on a billing
    # issue. macOS arm64; we use the homebrew-installed Python 3.12 directly
    # instead of actions/setup-python — that action assumes GitHub-hosted
    # paths (/Users/runner) that don't exist on a self-hosted setup.
    # Python 3.12 chosen because psycopg2-binary 2.9.9 has prebuilt wheels
    # for macosx_11_0_arm64 starting from cp312.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Show Python version
        run: /opt/homebrew/bin/python3.12 --version

      # Версии инструментов запинены. Без пинов они ставились «последние», а
      # стабильность держалась случайно: .venv переиспользуется между прогонами
      # (clean: false), pip видел «Requirement already satisfied» и не обновлял.
      # 2026-07-31 venv пересоздался, приехала ruff 0.16.1 с расширенными
      # дефолтами — 0 → 2659 ошибок на неизменившемся коде, CI встал колом.
      # Версии ниже — ровно те, что отработали на последнем зелёном прогоне
      # (28643628696, 2026-07-03). Обновлять осознанно, отдельным PR.
      # NB: пины здесь dependabot не отслеживает (это не requirements-файл) —
      # при переезде на requirements-dev.txt он начнёт слать PR-ы на них.
      - name: Create venv and install dependencies
        run: |
          /opt/homebrew/bin/python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            ruff==0.15.20 \
            mypy==2.1.0 \
            pytest==9.1.1 \
            pytest-cov==7.1.0 \
            pytest-asyncio==1.4.0 \
            pytest-mock==3.15.1 \
            bandit==1.9.4 \
            pip-audit==2.10.1
          if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; fi

      # Ruff — blocking. Долг расчищен (2026-05-13).
      # Любая новая ruff-ошибка должна быть исправлена в PR, не накапливаться.
      # Набор правил задан явно в ruff.toml (2026-07-31) — раньше конфига не
      # было и объём проверки менялся сам, от релиза ruff. Расширять select
      # там же, отдельным PR.
      - name: Run Ruff (Linting)
        run: .venv/bin/ruff check .

      # Mypy — blocking. Долг расчищен (2026-05-13, 176 → 0) через mypy.ini
      # с per-module overrides для SQLAlchemy-ORM-шума и реальных фиксов
      # union-attr/arg-type в auth/discord/llm/teamcity/celery_worker.
      - name: Run Mypy (Type Checking)
        run: .venv/bin/mypy .

      # Coverage gate. Текущий baseline после Э4.* — 58%. Gate с буфером в 3%
      # на флуктуации. Поднимать вручную при росте покрытия.
      - name: Run Pytest with Coverage
        run: .venv/bin/pytest --cov=app --cov-report=xml --cov-fail-under=55

      # Postgres для интеграционных тестов. Без него всё, что помечено
      # requires_postgres, СКИПАЕТСЯ — именно поэтому 07.08.2026 в master
      # уехала регрессия с несуществующей колонкой: 1765 юнит-тестов зелёные,
      # а SQL до базы не доходил вообще (секции мокают db.execute).
      # Docker на self-hosted раннере — от Rancher Desktop, сокет в ~/.rd
      # (тот же путь, что в джобе build-and-push).
      - name: Start Postgres for integration tests
        run: |
          set -e
          # $HOME берём в shell, а не через ${{ env.HOME }}: контекст env в
          # GHA содержит только переменные workflow/job/step, системного HOME
          # там нет — подстановка дала бы unix:///.rd/docker.sock.
          export DOCKER_HOST="unix://$HOME/.rd/docker.sock"
          docker rm -f copilot-ci-pg >/dev/null 2>&1 || true
          docker run -d --name copilot-ci-pg \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            -p 55432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec copilot-ci-pg pg_isready -U ci >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec copilot-ci-pg pg_isready -U ci

      # Гоняем ТОЛЬКО интеграционные наборы, а не весь pytest с DATABASE_URL.
      # Причина: при живой базе включаются ещё ~30 тестов, которые никогда не
      # исполнялись и сейчас падают (отдельный долг, чинится своим PR). Пока
      # они красные, включать их в обязательный прогон — значит вернуться к
      # практике merge через --admin bypass.
      - name: Integration tests against real Postgres schema
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:55432/ci
        run: |
          .venv/bin/pytest -q \
            tests/test_digest_sections_against_schema.py \
            tests/test_stats_digest_sql_schema.py

      - name: Stop Postgres
        if: always()
        run: |
          export DOCKER_HOST="unix://$HOME/.rd/docker.sock"
          docker rm -f copilot-ci-pg >/dev/null 2>&1 || true

      # bandit — статический security-скан кода. Игнорируем low/info,
      # фейлим только на medium+. Известные исключения добавлять в
      # .bandit/.bandit.yml, а не понижать порог.
      - name: Bandit (security static analysis)
        run: .venv/bin/bandit -r app -q --severity-level medium

      # pip-audit — blocking. Долг расчищен (2026-05-13, после bump-а
      # protobuf 4.25→5.29.6 и dotenv 1.0→1.2.2). Любая новая известная
      # CVE в зависимостях фейлит CI — fix через dependabot-PR или ручной bump.
      - name: pip-audit (dependency CVEs)
        run: .venv/bin/pip-audit --requirement requirements.txt --strict

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    # ubuntu-latest (GitHub-hosted) на froggychips даёт startup_failure —
    # джоба умирает за секунды без раннера (та же болезнь, что и macos-latest).
    # Self-hosted Mac: docker от Rancher Desktop, amd64 через эмуляцию VM.
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC для cosign keyless

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # macOS keychain недоступен из LaunchAgent-сессии раннера
      # (errSecInteractionNotAllowed -25308) — креды docker login храним
      # в job-local конфиге без credsStore, пользовательский
      # ~/.docker/config.json не трогаем. Контекст runner.* в job-level
      # env не разрешён — поэтому через RUNNER_TEMP + GITHUB_ENV.
      - name: Prepare job-local docker config (no osxkeychain)
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          # Job-local конфиг теряет три вещи из пользовательского
          # ~/.docker — восстанавливаем явно:
          # 1) credsStore none: с пустым конфигом docker CLI автодетектит
          #    osxkeychain из PATH (~/.rd/bin) → -25308 из LaunchAgent.
          # 2) cliPluginsExtraDirs: buildx/compose живут в
          #    ~/.docker/cli-plugins, без них «buildx is required».
          # 3) DOCKER_HOST: без currentContext docker идёт в
          #    /var/run/docker.sock, которого нет — сокет RD в ~/.rd.
          printf '{"credsStore":"none","cliPluginsExtraDirs":["%s/.docker/cli-plugins"]}' "$HOME" > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$HOME/.rd/docker.sock" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Встроенный GITHUB_TOKEN: у джобы есть packages:write, отдельный
          # PAT не нужен (GHCR_TOKEN в секретах репо никогда не существовал).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # ОБЯЗАТЕЛЬНО на ARM64-раннере: k8s-ноды amd64, образ без
          # --platform получится arm64 и не запустится (прецедент deploy.sh).
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Не публикуем :latest — в k8s pin по digest. Перетягиваем тег
          # ${{ github.sha }} вручную через retag при релизе, чтобы избежать
          # race "deployment пришёл, а :latest уже новый".

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign image (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX)
        run: |
          syft "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json > sbom.spdx.json

      - name: Cosign attach SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        # Дублирующая копия для удобства: канонический SBOM уже приаттачен
        # к образу cosign'ом (степ выше). Artifact storage квота аккаунта
        # переполнена — не валим джобу из-за convenience-копии.
        continue-on-error: true
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
