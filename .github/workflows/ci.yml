name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Дефолт для всех джоб. Без него `test` брала дефолтный GITHUB_TOKEN,
# а он на push-событиях идёт с write-правами на содержимое репозитория
# (CodeQL: actions/missing-workflow-permissions). Джобе нужен только
# checkout. У `build-and-push` свой блок ниже — он перекрывает этот и
# добавляет packages/id-token, необходимые для GHCR и OIDC-подписи.
permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    # Self-hosted runner (jabbook-air-m3-sre-copilot) because the froggychips
    # account is currently blocked from GitHub-hosted runners on a billing
    # issue. macOS arm64; we use the homebrew-installed Python 3.12 directly
    # instead of actions/setup-python — that action assumes GitHub-hosted
    # paths (/Users/runner) that don't exist on a self-hosted setup.
    #
    # ВНИМАНИЕ: 3.12 здесь ≠ 3.11 в Dockerfile (рантайм прода). Тесты идут НЕ
    # на версии прода — осознанный долг, а не проектное решение.
    # Прежнее обоснование («psycopg2-binary имеет arm64-колёса только с cp312»)
    # УСТАРЕЛО: проверено 2026-08-10 для запиненной 2.9.12 —
    # psycopg2_binary-2.9.12-cp311-cp311-macosx_11_0_arm64.whl существует.
    # Реальная причина сейчас одна: на раннере из homebrew стоят только
    # 3.12/3.13/3.14, python@3.11 не установлен.
    # Чтобы выровнять с продом: brew install python@3.11 на раннере, затем
    # заменить пути ниже на /opt/homebrew/bin/python3.11 (ruff.toml и mypy.ini
    # уже описывают 3.11 — см. комментарий в ruff.toml).
    runs-on: [self-hosted, macOS, ARM64]
    # Изоляция self-hosted раннера от чужого кода (security finding 19.08.2026).
    #
    # Раннер здесь persistent и работает под пользователем разработчика: рядом
    # с ним лежат ~/.kube/config с доступом к прод-кластеру, ~/.ssh/id_rsa,
    # ~/.aws/credentials и токены. Выполнить на нём PR из чужого форка —
    # значит отдать всё это автору PR.
    #
    # Approval-политика (all_external_contributors) — процедурная защита: она
    # держится на внимательности человека, нажимающего кнопку. Это условие —
    # структурная: job с форка не стартует вовсе, независимо от того, что
    # кто-то одобрил.
    #
    # Цена размена: PR из форков не получают автоматических проверок. Для
    # репозитория, чей CI живёт на личной машине с доступом к боевому
    # кластеру, это правильная сторона размена.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          clean: false
          # Теги нужны tests/test_version_consistency.py: он проверяет, что
          # каждый релиз эпохи 1.0.0 закрыт git-тегом. По умолчанию checkout
          # тянет только ref без тегов — тест видел пустой `git tag` и
          # объявлял нетегированными ВСЕ релизы, включая существующие.
          fetch-tags: true
          fetch-depth: 0

      - name: Show Python version
        run: /opt/homebrew/bin/python3.12 --version

      # Версии инструментов запинены. Без пинов они ставились «последние», а
      # стабильность держалась случайно: .venv переиспользуется между прогонами
      # (clean: false), pip видел «Requirement already satisfied» и не обновлял.
      # 2026-07-31 venv пересоздался, приехала ruff 0.16.1 с расширенными
      # дефолтами — 0 → 2659 ошибок на неизменившемся коде, CI встал колом.
      # Версии ниже — ровно те, что отработали на последнем зелёном прогоне
      # (28643628696, 2026-07-03). Обновлять осознанно, отдельным PR.
      # NB: пины здесь dependabot не отслеживает (это не requirements-файл) —
      # при переезде на requirements-dev.txt он начнёт слать PR-ы на них.
      - name: Create venv and install dependencies
        run: |
          /opt/homebrew/bin/python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            ruff==0.15.20 \
            mypy==2.1.0 \
            pytest==9.1.1 \
            pytest-cov==7.1.0 \
            pytest-asyncio==1.4.0 \
            pytest-mock==3.15.1 \
            bandit==1.9.4 \
            pip-audit==2.10.1
          if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; fi

      # Ruff — blocking. Долг расчищен (2026-05-13).
      # Любая новая ruff-ошибка должна быть исправлена в PR, не накапливаться.
      # Набор правил задан явно в ruff.toml (2026-07-31) — раньше конфига не
      # было и объём проверки менялся сам, от релиза ruff. Расширять select
      # там же, отдельным PR.
      - name: Run Ruff (Linting)
        run: .venv/bin/ruff check .

      # Mypy — blocking. Долг расчищен (2026-05-13, 176 → 0) через mypy.ini
      # с per-module overrides для SQLAlchemy-ORM-шума и реальных фиксов
      # union-attr/arg-type в auth/discord/llm/teamcity/celery_worker.
      - name: Run Mypy (Type Checking)
        run: .venv/bin/mypy .

      # Coverage gate. Фактическое покрытие 13.08.2026 — 80% (18312 строк,
      # 3649 не покрыто); гейт 75% = буфер 5пп на флуктуации.
      # До этого гейт стоял на 55% при baseline 58% — и с тех пор покрытие
      # выросло на 22пп, а гейт не двигался. Разрыв в 25пп означал, что можно
      # удалить четверть тестов и CI останется зелёным: гейт не защищал ничего.
      # Поднимать осознанно, вместе с ростом покрытия; опускать — только с
      # объяснением, почему деградация допустима.
      - name: Run Pytest with Coverage
        run: .venv/bin/pytest --cov=app --cov-report=xml --cov-fail-under=75

      # Postgres для интеграционных тестов. Без него всё, что помечено
      # requires_postgres, СКИПАЕТСЯ — именно поэтому 07.08.2026 в master
      # уехала регрессия с несуществующей колонкой: 1765 юнит-тестов зелёные,
      # а SQL до базы не доходил вообще (секции мокают db.execute).
      # Docker на self-hosted раннере — от Rancher Desktop, сокет в ~/.rd
      # (тот же путь, что в джобе build-and-push).
      - name: Start Postgres for integration tests
        run: |
          set -e
          # $HOME берём в shell, а не через env-контекст GHA: системного HOME
          # там нет, подстановка дала бы unix:///.rd/docker.sock.
          export DOCKER_HOST="unix://$HOME/.rd/docker.sock"
          docker rm -f copilot-ci-pg >/dev/null 2>&1 || true
          # Порт назначает docker (-p 0:5432), а не мы: раннер self-hosted, на
          # той же машине бывают чужие контейнеры и локальная отладка —
          # фиксированный 55432 уже дал "port is already allocated".
          # Готовность ждём по healthcheck контейнера, а не самодельным
          # циклом с pg_isready: первый вариант выходил из цикла раньше, чем
          # база начинала принимать соединения ("rejecting connections").
          docker run -d --name copilot-ci-pg \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            --health-cmd="pg_isready -U ci -d ci" \
            --health-interval=2s --health-timeout=3s --health-retries=30 \
            -p 0:5432 postgres:16-alpine
          # имя не status: в zsh это read-only спецпеременная, а шаг могут
          # запускать и не в bash при отладке
          pg_health=starting
          for _ in $(seq 1 45); do
            pg_health=$(docker inspect -f '{{.State.Health.Status}}' copilot-ci-pg 2>/dev/null || echo starting)
            [ "$pg_health" = "healthy" ] && break
            sleep 2
          done
          if [ "$pg_health" != "healthy" ]; then
            echo "::error::postgres не поднялся (health=$pg_health), логи контейнера:"
            docker logs copilot-ci-pg 2>&1 | tail -30
            exit 1
          fi
          PG_PORT=$(docker port copilot-ci-pg 5432/tcp | head -1 | sed 's/.*://')
          echo "PG_PORT=$PG_PORT" >> "$GITHUB_ENV"
          echo "postgres healthy, слушает 127.0.0.1:$PG_PORT"

      # Весь набор с живой базой. Раньше здесь гонялись только два
      # интеграционных файла: при DATABASE_URL включались ещё 45 тестов,
      # которые никогда не исполнялись и падали. Долг закрыт — два корня:
      #   1) dedup стал cross-replica (таблица discord_dedup, 10.06.2026), а
      #      тесты чистили только in-memory кэш → сервис уходил в PATCH
      #      вместо POST и падал на KeyError 'payload' (40 тестов);
      #   2) снапшоты эмбедов и e2e-статус зависели от состояния БД.
      # Схему готовим alembic-ом, а не create_all: так проверяется ещё и
      # применимость миграций к пустой базе.
      - name: Run alembic migrations
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:${{ env.PG_PORT }}/ci
          LLM_BACKEND: claude_cli
        run: .venv/bin/alembic upgrade head

      - name: Full test suite against real Postgres
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:${{ env.PG_PORT }}/ci
          LLM_BACKEND: claude_cli
        run: .venv/bin/pytest -q

      - name: Stop Postgres
        if: always()
        run: |
          export DOCKER_HOST="unix://$HOME/.rd/docker.sock"
          docker rm -f copilot-ci-pg >/dev/null 2>&1 || true

      # Golden-eval — blocking. Единственная метрика, которая описывает сам
      # продукт: до неё качество разбора инцидента проверялось шестью ручными
      # прогонами в README и 👍/👎 в Discord, то есть на глаз.
      # Здесь режим replay: записанные LLM-ответы, без сети и ключа —
      # детерминированно и бесплатно. Он меряет ОБВЕС вокруг модели (правила
      # фактов, grounding, отбор гипотезы, executor-гейт), а не саму модель;
      # качество промптов меряет отдельный eval-live.yml по расписанию.
      # --check-baseline валит шаг при просадке метрик, в том числе поgrouppам:
      # без разреза «плюс два кейса на факты» замаскировали бы «минус один
      # на гейт». Поднимать baseline — отдельным осознанным коммитом.
      - name: Golden eval (replay against baseline)
        env:
          LLM_BACKEND: claude_cli   # в replay модель не вызывается вообще
        run: .venv/bin/python scripts/eval_golden.py --mode replay --check-baseline

      # bandit — статический security-скан кода. Игнорируем low/info,
      # фейлим только на medium+. Известные исключения добавлять в
      # .bandit/.bandit.yml, а не понижать порог.
      - name: Bandit (security static analysis)
        run: .venv/bin/bandit -r app -q --severity-level medium

      # pip-audit — blocking. Долг расчищен (2026-05-13, после bump-а
      # protobuf 4.25→5.29.6 и dotenv 1.0→1.2.2). Любая новая известная
      # CVE в зависимостях фейлит CI — fix через dependabot-PR или ручной bump.
      - name: pip-audit (dependency CVEs)
        run: .venv/bin/pip-audit --requirement requirements.txt --strict

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    # ubuntu-latest (GitHub-hosted) на froggychips даёт startup_failure —
    # джоба умирает за секунды без раннера (та же болезнь, что и macos-latest).
    # Self-hosted Mac: docker от Rancher Desktop, amd64 через эмуляцию VM.
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC для cosign keyless

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # macOS keychain недоступен из LaunchAgent-сессии раннера
      # (errSecInteractionNotAllowed -25308) — креды docker login храним
      # в job-local конфиге без credsStore, пользовательский
      # ~/.docker/config.json не трогаем. Контекст runner.* в job-level
      # env не разрешён — поэтому через RUNNER_TEMP + GITHUB_ENV.
      - name: Prepare job-local docker config (no osxkeychain)
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          # Job-local конфиг теряет три вещи из пользовательского
          # ~/.docker — восстанавливаем явно:
          # 1) credsStore none: с пустым конфигом docker CLI автодетектит
          #    osxkeychain из PATH (~/.rd/bin) → -25308 из LaunchAgent.
          # 2) cliPluginsExtraDirs: buildx/compose живут в
          #    ~/.docker/cli-plugins, без них «buildx is required».
          # 3) DOCKER_HOST: без currentContext docker идёт в
          #    /var/run/docker.sock, которого нет — сокет RD в ~/.rd.
          printf '{"credsStore":"none","cliPluginsExtraDirs":["%s/.docker/cli-plugins"]}' "$HOME" > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$HOME/.rd/docker.sock" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Встроенный GITHUB_TOKEN: у джобы есть packages:write, отдельный
          # PAT не нужен (GHCR_TOKEN в секретах репо никогда не существовал).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # ОБЯЗАТЕЛЬНО на ARM64-раннере: k8s-ноды amd64, образ без
          # --platform получится arm64 и не запустится (прецедент deploy.sh).
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Не публикуем :latest — в k8s pin по digest. Перетягиваем тег
          # ${{ github.sha }} вручную через retag при релизе, чтобы избежать
          # race "deployment пришёл, а :latest уже новый".

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign image (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX)
        run: |
          syft "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json > sbom.spdx.json

      - name: Cosign attach SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        # Дублирующая копия для удобства: канонический SBOM уже приаттачен
        # к образу cosign'ом (степ выше). Artifact storage квота аккаунта
        # переполнена — не валим джобу из-за convenience-копии.
        continue-on-error: true
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
