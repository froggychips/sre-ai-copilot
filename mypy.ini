[mypy]
# python_version ОБЯЗАН совпадать с python в Dockerfile (источник истины по
# рантайму) и с target-version в ruff.toml. Гейт —
# tests/test_ops_manifests.py::test_python_version_is_consistent_across_toolchain.
# Было 3.12 при `FROM python:3.11-slim`: mypy проверял типы по stdlib-стабам
# 3.12 и молча пропускал то, чего в 3.11 нет (`typing.override`,
# `itertools.batched`, `typing.TypeAliasType`, PEP 695) — падало бы уже в
# проде, на импорте модуля. Обоснование выбора «опустить тулинг, а не поднять образ» — в ruff.toml.
python_version = 3.11

# Внешние зависимости без py.typed (kubernetes, celery, structlog, prometheus_client,
# tenacity, jose etc.) — игнорируем отсутствие stubs, иначе тонем в [import-untyped].
ignore_missing_imports = True

# Тесты/миграции/служебные скрипты — не часть production-кода.
exclude = (?x)(
    ^tests/
    | ^scripts/
    | ^alembic/
    | ^\.venv/
  )

# Не падать на untyped-функциях (нет type-аннотаций) — это отдельный долг.
check_untyped_defs = False

# Pydantic 2.x: Settings(...) с дефолтами на каждом поле — pydantic-mypy-plugin
# несовместим с mypy 2.1; точечно глушим [call-arg] false-positive.
[mypy-app.config]
disable_error_code = call-arg

# SQLAlchemy 2.0 legacy declarative_base() возвращает Variable вместо class —
# mypy не может использовать как basetype. Refactor на DeclarativeBase + Mapped[T]
# отложен; до тех пор глушим шум по ORM-патернам.
[mypy-app.database]
disable_error_code = valid-type, misc

[mypy-app.knowledge_graph.populator]
disable_error_code = assignment, arg-type

[mypy-app.knowledge_graph.queries]
disable_error_code = assignment, arg-type, union-attr, call-overload

[mypy-app.knowledge_graph.health_score]
disable_error_code = assignment

[mypy-app.knowledge_graph.drift_cleanup]
disable_error_code = assignment

[mypy-app.knowledge_graph.alerts_resolve_sync]
disable_error_code = assignment

[mypy-app.knowledge_graph.k8s_events_sync]
disable_error_code = misc

[mypy-app.services.alert_enrichment]
disable_error_code = assignment, index, call-overload

[mypy-app.core.intelligence.similar_incidents]
disable_error_code = arg-type, union-attr, assignment

# Endpoint-обработчики, которые присваивают значения в SQLAlchemy-ORM поля —
# та же [assignment]/[dict-item] проблема `Column[T]` vs `T`. Уйдёт после
# миграции моделей на DeclarativeBase + Mapped[T].
[mypy-app.api.webhooks]
disable_error_code = assignment, dict-item, call-overload

[mypy-app.api.discord_interactions]
disable_error_code = assignment

[mypy-app.api.replay]
disable_error_code = arg-type

[mypy-app.evaluation.feedback]
disable_error_code = assignment

[mypy-app.knowledge_graph.auto_populator]
disable_error_code = union-attr

# executor_apply.py — присваивает в IncidentRecord.analysis (JSON Column).
# Тот же Column[Any] vs dict[str, Any] паттерн что и в api.webhooks/feedback.
[mypy-app.services.executor_apply]
disable_error_code = assignment

# structlog WriteLoggerFactory + processors — typed loosely в structlog 23.2.
[mypy-app.services.audit_logger]
disable_error_code = arg-type

# redis-py async API: тип-аннотации возвращают Awaitable[T] | T (для sync/async
# полиморфизма), mypy жалуется на await. Это работает корректно в runtime.
[mypy-app.services.session_manager]
disable_error_code = misc

[mypy-app.services.resilience]
disable_error_code = misc, arg-type

# IncidentPipeline — stateful orchestrator: instance-state поля стартуют как None
# в __init__, затем set в run() до использования в stage_*. Mypy не следит за
# control-flow между методами и репортит union-attr на каждое использование.
# Логика корректна (run() задаёт порядок), от mypy в этом случае пользы мало.
[mypy-app.workers.pipeline]
# has-type/attr-defined сняты: _hypothesis_set теперь объявлен в __init__
# (раньше существовал только как self._hypothesis_set=… в stage_hypothesize).
# Остаются: union-attr (Optional stage-outputs fact_store/critiqued/best —
# выставляются по порядку в run(), но mypy не видит cross-method control-flow)
# + ORM Column[T] vs T (assignment/arg-type/valid-type/misc). Полное снятие —
# через typed-state рефактор (PipelineState dataclass), требует mypy в петле.
disable_error_code = union-attr, arg-type, assignment, valid-type, misc
