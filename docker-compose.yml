# ⚠️ DEV-ONLY compose-файл. Для prod-деплоя — k8s/ манифесты (in-cluster
# ServiceAccount + SealedSecrets), а НЕ этот compose.
#
# kubeconfig в контейнер НЕ маунтится: при компрометации контейнера токены
# уехали бы в кластер. Локально работаем через переменную KUBECONFIG,
# которую compose пробрасывает из .env (если разработчику нужен kubectl
# внутри контейнера, он явно монтирует нужный конкретный конфиг через
# `docker compose run -v $PWD/local-kubeconfig:/home/sre/.kube/config:ro ...`).
version: '3.8'

services:
  api:
    build: .
    container_name: sre-ai-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

  worker:
    build: .
    container_name: sre-ai-worker
    command: python -m app.queue.worker
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: sre-ai-redis
    ports:
      - "6379:6379"
