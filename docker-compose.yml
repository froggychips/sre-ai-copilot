# ⚠️ DEV-ONLY compose-файл. Для prod-деплоя — k8s/ манифесты (in-cluster
# ServiceAccount + SealedSecrets), а НЕ этот compose.
#
# kubeconfig в контейнер НЕ маунтится: при компрометации контейнера токены
# уехали бы в кластер. Локально работаем через переменную KUBECONFIG,
# которую compose пробрасывает из .env (если разработчику нужен kubectl
# внутри контейнера, он явно монтирует нужный конкретный конфиг через
# `docker compose run -v $PWD/local-kubeconfig:/home/sre/.kube/config:ro ...`).
version: '3.8'

services:
  api:
    build: .
    container_name: sre-ai-api
    ports:
      - "8000:8000"
      - "8001:8001"   # Prometheus metrics
    env_file: .env
    environment:
      - OTLP_EXPORTER_ENDPOINT=http://otelcollector:4317
    depends_on:
      - redis
      - otelcollector
    volumes:
      - .:/app

  worker:
    build: .
    container_name: sre-ai-worker
    # Боевой Celery-worker (как в k8s/worker.yaml). Старый `python -m
    # app.queue.worker` тянул rq, которого нет в requirements → мгновенный
    # ModuleNotFoundError (сам app/queue/ выпиливается).
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - OTLP_EXPORTER_ENDPOINT=http://otelcollector:4317
    depends_on:
      - redis
      - otelcollector
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: sre-ai-redis
    # ⚠️ DEV-ONLY: Redis без auth опубликован на хост (6379) — любой процесс
    # на машине (и сеть, если docker слушает не только localhost) имеет
    # полный доступ к брокеру. Ни в коем случае не воспроизводить в prod.
    ports:
      - "6379:6379"

  otelcollector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: sre-ai-otelcollector
    ports:
      - "4317:4317"   # OTLP gRPC (от app и от локальных скриптов)
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./docker/otelcollector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sre-ai-jaeger
    ports:
      - "16686:16686"   # UI — http://localhost:16686
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sre-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.3
    container_name: sre-ai-grafana
    ports:
      - "3000:3000"
    # ⚠️ DEV-ONLY: анонимный Admin без формы логина — кто открыл :3000, тот
    # админ Grafana. Допустимо только на локальной машине разработчика.
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
